# SPDX-FileCopyrightText: 2026 DTU_DZ_2
# SPDX-License-Identifier: GPL-3.0-or-later
# Khai báo giấy phép cho tệp không chứa được chú thích SPDX (JSON, ảnh, video, tài liệu .md) theo
# đặc tả REUSE 3.x (https://reuse.software). Tệp mã/cấu hình mang header riêng (make license, make check);
# precedence = "closest": header trong tệp (nếu có) được ưu tiên. Kiểm: reuse lint (D-010, #47).
version = 1
SPDX-PackageName = "Commune DX-OS"
SPDX-PackageSupplier = "DTU_DZ_2"
SPDX-PackageDownloadLocation = "https://github.com/commune-dxos/commune-dxos"

[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "docs/images/**",
  # docs/media/demo-app-*.gif: quay màn hình app của đội trên iOS Simulator, ảnh trong đó là giấy tờ mẫu giả của
  # repo (mot-cua/web-cong-dan/public/mau-gia/); khung chọn ảnh, thanh trạng thái là giao diện hệ thống iOS.
  "docs/media/**",
  # Biểu tượng của cổng công dân: bản sao docs/images/logo/ (#61), Vite phục vụ từ public/.
  "mot-cua/web-cong-dan/public/**",
  # App di động (#155): biểu tượng launcher và logo sinh từ docs/images/logo/mark-512.png, khóa yarn.
  "mot-cua/di-dong/android/app/src/main/res/mipmap-*/*.png",
  "mot-cua/di-dong/src/tai-nguyen/**",
  "mot-cua/di-dong/yarn.lock",
  "mot-cua/di-dong/.watchmanconfig",
  # App iOS: tệp Xcode/CocoaPods sinh ra hoặc Xcode tự ghi lại nên không giữ được chú thích (dự án, scheme,
  # workspace, Info.plist, storyboard, privacy manifest, khóa pod); biểu tượng sinh từ docs/images/logo/mark.png.
  "mot-cua/di-dong/ios/MotCuaXa.xcodeproj/**",
  "mot-cua/di-dong/ios/MotCuaXa.xcworkspace/**",
  "mot-cua/di-dong/ios/MotCuaXa/Info.plist",
  "mot-cua/di-dong/ios/MotCuaXa/PrivacyInfo.xcprivacy",
  "mot-cua/di-dong/ios/MotCuaXa/LaunchScreen.storyboard",
  "mot-cua/di-dong/ios/MotCuaXa/Images.xcassets/**",
  "mot-cua/di-dong/ios/Podfile.lock",
  ".gitignore",
  "NOTICE",
  "nen-tang/rabbitmq/enabled_plugins",
  # Tệp có header SPDX đúng, nhưng reuse 6.2 đọc 2048 byte đầu để đoán bảng mã, cắt giữa một ký tự
  # UTF-8 tiếng Việt nên coi là tệp nhị phân và bỏ qua header.
  "nen-tang/postgres/initdb/10-core.sql",
  "mot-cua/web-cong-dan/src/index.css",
  "mot-cua/backend/tests/test_tro_ly.py",
  "mot-cua/tests/smoke-kho-du-lieu.sh",
  "mot-cua/tests/smoke.sh",
  "mot-cua/web-cong-dan/src/can-bo/du-lieu.tsx",
  "scripts/sinh_giay_to_gia.py",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 DTU_DZ_2"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Mẫu Go template của step-ca (#77): header là chú thích {{- /* … */ -}}, reuse đọc cả đuôi "*/ -}}" vào biểu
# thức giấy phép. Khai ở đây và ghi đè thông tin trong tệp (#104); make check vẫn kiểm header trong tệp.
[[annotations]]
path = "nen-tang/step-ca/ky-tai-lieu.tpl"
precedence = "override"
SPDX-FileCopyrightText = "2026 DTU_DZ_2"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Dữ liệu mở (#102): bộ dữ liệu thủ tục cấp xã theo CC-BY-4.0, không phải GPL. Bảng này đứng sau bảng chung ở
# trên nên được ưu tiên với các tệp trong du-lieu-mo/ (REUSE: bảng khớp sau cùng thắng). Toàn văn:
# LICENSES/CC-BY-4.0.txt, chép kèm thư mục thành du-lieu-mo/thu-tuc-cap-xa/LICENSE.
[[annotations]]
path = "du-lieu-mo/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 DTU_DZ_2"
SPDX-License-Identifier = "CC-BY-4.0"

# App di động (#155): Gradle wrapper đi kèm khung React Native (@react-native-community/template 0.80.3),
# giữ nguyên tệp gốc của Gradle (Apache-2.0); gradlew.bat có thêm phần sửa của Meta theo MIT. Không sửa.
[[annotations]]
path = ["mot-cua/di-dong/android/gradlew", "mot-cua/di-dong/android/gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "2015-2021 the original authors (Gradle)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "mot-cua/di-dong/android/gradlew.bat"
precedence = "override"
SPDX-FileCopyrightText = ["Meta Platforms, Inc. and affiliates", "2015 the original author or authors (Gradle)"]
SPDX-License-Identifier = "Apache-2.0 AND MIT"
