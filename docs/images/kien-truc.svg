<!-- Sơ đồ kiến trúc Commune DX-OS v0.1.0, vẽ tay theo docker-compose.yml (profile core), core/, apps/mot-cua/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="tieu-de mo-ta">
  <title id="tieu-de">Kiến trúc Commune DX-OS v0.1.0</title>
  <desc id="mo-ta">Tầng 2 (apps/mot-cua) gồm cổng công dân, cổng cán bộ (tuần 3), app-backend và app-worker. Tầng 1 (core) gồm Keycloak, APISIX, PostgREST, PostgreSQL, Flowable, Garage, ClamAV, RabbitMQ, OpenBao. Người dùng đăng nhập Keycloak, gọi APISIX bằng JWT; APISIX chuyển /public và /api tới PostgREST, /workflow và /files tới app-backend, /files/s3 tới Garage. app-backend quét tệp bằng ClamAV trước khi lưu vào Garage, ghi sự kiện vào hộp thư đi trong PostgreSQL; app-worker phát sự kiện lên RabbitMQ. OpenBao cấp bí mật cho mọi dịch vụ.</desc>
