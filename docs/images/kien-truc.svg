  <text class="ten" x="56" y="515">OpenBao 2.7</text>
  <text class="dong" x="56" y="536">két bí mật của mọi dịch vụ</text>
  <text class="dong" x="56" y="556">mỗi dịch vụ một AppRole</text>
  <text class="dong" x="56" y="573">+ policy chỉ đọc phần của mình</text>
  <text class="dong" x="56" y="593">agent *-secrets render tệp</text>
  <text class="dong" x="56" y="610">bí mật vào volume (quyền 0400)</text>
  <text class="dong" x="56" y="630">.env không chứa mật khẩu</text>
  <text class="dong" x="56" y="650">bao-init tự init + unseal</text>
  <text class="dong" x="56" y="667">ở mỗi make up (máy dev)</text>
  <text class="nho" x="56" y="700">MPL-2.0 · thay HashiCorp Vault</text>
  <text class="nho" x="56" y="715">(BSL, không phải OSI)</text>
