  <text class="nho" x="36" y="910">Không mở cổng ra máy host: PostgREST, app-backend, app-worker, Garage, ClamAV, RabbitMQ, OpenBao. Cổng debug chỉ trên 127.0.0.1: PostgreSQL, Flowable.</text>
  <text class="nho" x="36" y="928">Chưa có trong compose (kế hoạch tuần 4–5): Gotenberg, step-ca + pyHanko, Superset, Meilisearch CE, OCR + Ollama. Chi tiết: docs/architecture.md.</text>
