# Commune DX-OS – nền tảng Tầng 1 (headless) + bộ máy một cửa Tầng 2 + gói thủ tục. Sơ đồ: docs/architecture.md
#
# Ba lớp thư mục (D-009):
#   nen-tang/   Tầng 1 dùng chung, không chứa nghiệp vụ. Dịch vụ một lần của nền tảng (tang2-*,
#               garage-init, rabbitmq-init) chỉ biết quy ước thư mục của dịch vụ Tầng 2 được mount
#               vào /tang2 và tên của nó (DXOS_TANG2, cố định trong tệp này: x-tang2).
#   mot-cua/    bộ máy một cửa Tầng 2 dùng chung cho mọi thủ tục:
#     postgrest.env        cấu hình PostgREST (schema phơi ra API)
#     db/migrations/*.sql  schema, role, RLS  → dịch vụ một lần tang2-migrate
#     db/seed/*.sql        dữ liệu giả        → tang2-migrate khi DXOS_SEED=true
#     keycloak/realm.json  vai trò, nhóm, client, người dùng mẫu → dịch vụ một lần tang2-realm
#     backend/main.py      API một cửa (D-008) → dịch vụ mot-cua-api, APISIX /workflow/*, /files/*
#     backend/worker.py    tác vụ nền (outbox → RabbitMQ, cảnh báo trễ hạn) → dịch vụ mot-cua-worker
#     backend/nap_thu_tuc.py  bộ nạp gói thủ tục → dịch vụ một lần nap-thu-tuc (make nap-thu-tuc)
#     s3/buckets.conf      bucket S3 → garage-init tạo bucket + khóa riêng
#     rabbitmq/definitions.json  exchange, queue, binding → rabbitmq-init (vhost riêng)
#   thu-tuc/<ma>/  mỗi thủ tục hành chính một gói: thu-tuc.yaml, quy-trinh.bpmn20.xml,
#               thanh-phan-ho-so.schema.json, du-lieu-mau.json. nap-thu-tuc kiểm gói, deploy BPMN lên
#               Flowable, ghi danh mục vào CSDL. Thêm thủ tục = thêm thư mục (docs/thu-tuc.md).
#
# Profile:
#   core : PostgreSQL, Keycloak, APISIX, PostgREST   (tuần 1, v0.0.1)
#          + Flowable REST (workflow, #8), mot-cua-api (/workflow, #6), nap-thu-tuc (D-009)
#          + Garage (S3) và ClamAV (quét tệp trước khi lưu) (#7)
#          + OpenBao giữ mọi bí mật dịch vụ (#10)
#          + RabbitMQ hàng đợi sự kiện, mot-cua-worker (#9)
#          + cổng công dân mot-cua-web, APISIX phục vụ ở route / (#57)
#          + step-ca (CA nội bộ), ca-init, Gotenberg: biên nhận/kết quả PDF có ký số thuộc luồng
#            nộp hồ sơ chính nên chạy cùng core (#77)
#   docs : Meilisearch CE                              (tuần 5)
#   ai   : Ollama + Qwen2.5 7B, OCR                   (tuần 5)
#   bi   : kho-du-lieu (dịch vụ một lần: hồ sơ đã đóng → Parquet → dbt → bảng mart bao_cao, #80;
#          make kho-du-lieu), Apache Superset (dashboard /bao-cao, SSO Keycloak, #82): make up-bi
#
# Bí mật (#10, docs/architecture.md §4.4): KHÔNG có mật khẩu, khóa hay token nào trong repo
# hay .env. OpenBao (KV v2 `dxos/`) là nguồn duy nhất; bao-init khởi tạo/unseal và nạp bí
# mật lõi, mỗi dịch vụ một AppRole với policy chỉ đọc đúng phần của mình
# (nen-tang/openbao/policies/). Dịch vụ lấy bí mật theo hai cách:
#   - image không tự gọi HTTP được (PostgreSQL, PostgREST, Keycloak, Flowable, Garage, RabbitMQ):
#     agent một lần `<danh tính>-secrets` render tệp quyền 0400 vào volume riêng
#     `<danh tính>-secrets`, dịch vụ mount chỉ đọc;
#   - tang2-realm, garage-init, rabbitmq-init, mot-cua-api, mot-cua-worker, nap-thu-tuc: tự đăng
#     nhập AppRole và đọc/ghi qua HTTP API,
#     volume riêng chỉ chứa role_id/secret_id.
#
# Quy tắc: ghim phiên bản image cụ thể (không dùng `latest`), image lấy từ dự án gốc,
# mọi dịch vụ có healthcheck, cấu hình qua .env (mẫu: .env.example).

name: commune

# Tên dịch vụ Tầng 2 mà nền tảng phục vụ: nhánh OpenBao dxos/tang2/<tên>/, vhost RabbitMQ, sổ
# migration. Bộ máy một cửa là dịch vụ Tầng 2 duy nhất; thủ tục cắm vào qua thu-tuc/, không qua đây.
x-tang2: &tang2 mot-cua

# Mẫu chung của agent OpenBao một lần (#10): đăng nhập AppRole của danh tính, render bí mật
# theo nen-tang/openbao/agent/<danh tính>.hcl vào volume của danh tính rồi thoát (mã 1 nếu policy
# chặn hay OpenBao seal). Chạy lại ở mỗi `up`, nên đổi bí mật trong OpenBao rồi `make up` là
# dịch vụ nhận giá trị mới khi khởi động lại.
x-bao-agent: &bao-agent
  image: openbao/openbao:2.7.1
  profiles: [core]
  entrypoint: ["bao", "agent"]
  depends_on:
    bao-init:
      condition: service_completed_successfully
  healthcheck:
    disable: true
  restart: "no"

# Dashboard (Apache-2.0): image gốc apache/superset bản lean + driver PostgreSQL và Authlib
# (nen-tang/superset/Dockerfile), không sửa mã. Cấu hình nen-tang/superset/superset_config.py: metadata
# trong CSDL superset của PostgreSQL lõi, không Redis/Celery, chạy dưới /bao-cao của APISIX, đăng nhập
# chỉ bằng SSO Keycloak (client public DXOS_SUPERSET_CLIENT, PKCE), vai Superset theo client role của
# dxos_api. Không mở cổng ra host.
x-superset: &superset
  build:
    context: ./nen-tang/superset
  image: commune-dxos/superset:6.1.0
  profiles: [bi]
  environment: &superset-env
    SUPERSET_CONFIG_PATH: /nen-tang/superset/superset_config.py
    SUPERSET_APP_ROOT: /bao-cao
    DXOS_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
    DXOS_KEYCLOAK_NOI_BO: http://keycloak:8080
    DXOS_KEYCLOAK_REALM: dxos
    DXOS_SUPERSET_CLIENT: bao_cao_superset
    DXOS_SUPERSET_TEN: Báo cáo một cửa
    # Client role của dxos_api (do dịch vụ Tầng 2 khai) → vai Superset (do mot-cua/bao-cao/ dựng).
    DXOS_SUPERSET_VAI_TRO: '{"lanh_dao": ["Lãnh đạo xã"]}'
    DXOS_BAO_CAO_DB: ${POSTGRES_DB:-commune}
  volumes:
    - ./nen-tang/superset:/nen-tang/superset:ro
    - ./mot-cua:/tang2:ro
    - superset-secrets:/run/dxos-secrets:ro

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    # postgres:17.6-alpine + pgAudit 17.1 biên dịch từ mã nguồn ghim SHA-256 (#75): nen-tang/postgres/Dockerfile.
    build:
      context: ./nen-tang/postgres
    image: commune-dxos/postgres:17.6-pgaudit17.1
    profiles: [core]
    # pgAudit (#75) ghi vào log PostgreSQL (docker compose logs postgres) các dòng "AUDIT: …":
    #   SESSION: lớp câu lệnh theo DXOS_PGAUDIT_LOG (mặc định ddl,role: đổi schema, role, quyền);
    #   OBJECT: câu lệnh chạm bảng mà role dxos_kiem_toan có quyền tương ứng (Tầng 2 tự GRANT bảng
    #           có dữ liệu cá nhân cho role này, ví dụ mot-cua/db/migrations/007_nhat_ky_kiem_toan.sql).
    # Không ghi tham số câu lệnh (log_parameter tắt) để log không chứa dữ liệu cá nhân.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=${DXOS_PGAUDIT_LOG:-ddl,role}
      - -c
      - pgaudit.role=dxos_kiem_toan
      - -c
      - pgaudit.log_catalog=off
      - -c
      - pgaudit.log_relation=on
      - -c
      - pgaudit.log_parameter=off
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commune}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Mật khẩu superuser (chỉ dùng khi initdb volume trống) từ OpenBao, agent db-secrets.
      POSTGRES_PASSWORD_FILE: /run/dxos-secrets/postgres_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./nen-tang/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - db-secrets:/run/dxos-secrets:ro
    ports:
      # Chỉ mở trên máy local để debug bằng psql; Tầng 2 không gọi thẳng CSDL.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    depends_on:
      db-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [core]
    # start-dev: HTTP, phù hợp chạy local. Triển khai thật dùng `start` + TLS.
    # kc-start.sh đọc mật khẩu CSDL và quản trị khởi tạo từ volume keycloak-secrets (OpenBao).
    entrypoint: ["/bin/bash", "/nen-tang/scripts/kc-start.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      # Issuer cố định theo địa chỉ trình duyệt dùng; APISIX/PostgREST gọi nội bộ
      # qua http://keycloak:8080 nhờ backchannel động.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./nen-tang/keycloak/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
      - ./nen-tang/scripts/kc-start.sh:/nen-tang/scripts/kc-start.sh:ro
      - keycloak-secrets:/run/dxos-secrets:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Image không có curl: dùng /dev/tcp của bash gọi cổng quản trị 9000.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Lấy khóa công khai (JWKS) của realm cho PostgREST rồi thoát.
  # Dùng lại image postgres (đã có wget của busybox) để không kéo thêm image.
  jwks-init:
    image: postgres:17.6-alpine
    profiles: [core]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        wget -qO /jwks/jwks.json http://keycloak:8080/realms/dxos/protocol/openid-connect/certs && exit 0;
        sleep 2; done; echo 'Không lấy được JWKS từ Keycloak' >&2; exit 1
    volumes:
      - jwks:/jwks
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /jwks/jwks.json"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"

  # Áp dụng migration + seed SQL của dịch vụ Tầng 2 (nen-tang/scripts/tang2-migrate.sh) rồi thoát.
  # Chạy lại an toàn: tệp đã áp dụng được bỏ qua. Chạy tay: make migrate.
  tang2-migrate:
    image: postgres:17.6-alpine
    profiles: [core]
    entrypoint: ["/bin/sh", "/nen-tang/scripts/tang2-migrate.sh"]
    environment:
      DXOS_TANG2: *tang2
      DXOS_SEED: ${DXOS_SEED:-false}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-commune}
      PGPASSFILE: /run/dxos-secrets/pgpass
    volumes:
      - ./nen-tang/scripts:/nen-tang/scripts:ro
      - ./mot-cua:/tang2:ro
      - db-secrets:/run/dxos-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Nạp vai trò, nhóm, client, người dùng mẫu của Tầng 2 vào realm lõi `dxos`
  # (Keycloak Partial Import, bỏ qua đối tượng đã có) rồi thoát. Dùng lại image Keycloak.
  # Mật khẩu quản trị Keycloak đọc từ OpenBao; client secret của client dịch vụ (service
  # account) ghi vào OpenBao (AppRole tang2-realm, volume tang2-realm-secrets chỉ có role_id/
  # secret_id). Chạy bằng root để đọc được tệp AppRole (chủ root, quyền 0400).
  tang2-realm:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [core]
    user: "0"
    entrypoint: ["/bin/bash", "/nen-tang/scripts/tang2-realm.sh"]
    environment:
      DXOS_TANG2: *tang2
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./nen-tang/scripts:/nen-tang/scripts:ro
      - ./mot-cua:/tang2:ro
      - tang2-realm-secrets:/run/dxos-secrets:ro
    depends_on:
      keycloak:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v13.0.4
    profiles: [core]
    environment:
      # URI kết nối (chứa mật khẩu authenticator) đọc từ tệp do agent postgrest-secrets render.
      PGRST_DB_URI: "@/run/dxos-secrets/db-uri"
      # PGRST_DB_SCHEMAS lấy từ mot-cua/postgrest.env (env_file bên dưới).
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      PGRST_JWT_AUD: dxos_api
      # Mỗi người dùng có đúng một client role của dxos_api (Tầng 2 khai báo),
      # trùng tên role PostgreSQL → PostgREST SET ROLE → RLS áp dụng.
      PGRST_JWT_ROLE_CLAIM_KEY: .resource_access.dxos_api.roles[0]
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_LOG_LEVEL: info
      # OpenAPI ở gốc /api/ và /public/ chỉ liệt kê bảng, cột mà role của request được quyền
      # (anon thấy danh mục công khai) – không lộ cấu trúc ngoài quyền của người gọi.
      PGRST_OPENAPI_MODE: follow-privileges
      # Chặn trên số dòng mỗi response, tránh một request đọc cả bảng lớn.
      PGRST_DB_MAX_ROWS: "1000"
      # PostgREST mặc định cho mọi origin; giới hạn giống CORS của APISIX. PostgREST từ chối request
      # có Origin lạ, nên luôn kèm origin của gateway (cổng công dân mot-cua-web, #57).
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${DXOS_GATEWAY_URL:-http://localhost:9080},${DXOS_CORS_ORIGINS:-http://localhost:5173}
    env_file:
      - ./mot-cua/postgrest.env
    volumes:
      - jwks:/jwks:ro
      - postgrest-secrets:/run/dxos-secrets:ro
    # Không mở cổng ra host: Tầng 2 chỉ đi qua APISIX.
    expose:
      - "3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgrest-secrets:
        condition: service_completed_successfully
      jwks-init:
        condition: service_completed_successfully
      tang2-migrate:
        condition: service_completed_successfully
    # Không dùng healthcheck của Docker: image amd64 dựng FROM scratch (không có shell)
    # và v13.0.4 chưa có cờ `--ready` (đã chạy thử 17/10/2026). Thay vào đó APISIX
    # kiểm chủ động http://postgrest:3001/ready (xem upstream trong nen-tang/apisix/apisix.yaml).
    healthcheck:
      disable: true
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.13.0-debian
    profiles: [core]
    # Chế độ standalone khai báo trong config.yaml (không đặt APISIX_STAND_ALONE,
    # vì entrypoint sẽ ghi đè config.yaml đã mount).
    environment:
      # Nguồn (origin) web của Tầng 2 được gọi API từ trình duyệt, cách nhau bởi dấu phẩy.
      # Đọc trong nen-tang/apisix/apisix.yaml bằng ${{DXOS_CORS_ORIGINS}}. Luôn kèm origin của
      # gateway: cổng công dân mot-cua-web được phục vụ ở đó (#57).
      DXOS_CORS_ORIGINS: ${DXOS_GATEWAY_URL:-http://localhost:9080},${DXOS_CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./nen-tang/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./nen-tang/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_PORT:-9080}:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      postgrest:
        condition: service_started
      tang2-realm:
        condition: service_completed_successfully
      mot-cua-api:
        condition: service_healthy
      garage:
        condition: service_healthy
      mot-cua-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9080'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Role đăng nhập + CSDL riêng của dịch vụ lõi (authenticator, keycloak, flowable), mật
  # khẩu theo OpenBao (nen-tang/scripts/db-init.sh), rồi thoát. Chạy mỗi lần `up`, không lỗi
  # nếu đã có, nên dùng được với volume cũ và đổi mật khẩu trong OpenBao là PostgreSQL theo.
  # Thay flowable-db-init và initdb/20-auth.sh (#10). Dùng lại image postgres.
  db-init:
    image: postgres:17.6-alpine
    profiles: [core]
    entrypoint: ["/bin/sh", "/nen-tang/scripts/db-init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-commune}
      PGPASSFILE: /run/dxos-secrets/pgpass
    volumes:
      - ./nen-tang/scripts:/nen-tang/scripts:ro
      - db-secrets:/run/dxos-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Workflow engine BPMN 2.0 (Apache-2.0). Chỉ dùng flowable-rest (D-004): không có modeler,
  # BPMN viết XML tay trong thu-tuc/<ma>/quy-trinh.bpmn20.xml. Flowable KHÔNG tự quét thư mục
  # nào (tắt check-process-definitions và quy trình demo): dịch vụ nap-thu-tuc kiểm gói rồi
  # deploy qua REST API, bỏ qua BPMN không đổi.
  # REST API: http://flowable:8080/flowable-rest/service (Basic auth tài khoản rest-admin).
  # Tầng 2 không gọi thẳng: APISIX /workflow/* → mot-cua-api → Flowable (#6). Cổng host chỉ
  # mở trên 127.0.0.1 để debug/smoke; API quản trị không đi qua gateway.
  flowable:
    image: flowable/flowable-rest:8.0.0
    profiles: [core]
    environment:
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "10"
      FLOWABLE_REST_APP_ADMIN_USER-ID: rest-admin
      # spring.datasource.password và flowable.rest.app.admin.password: mỗi thuộc tính một tệp
      # (tên tệp = tên thuộc tính) do agent flowable-secrets render từ OpenBao (Spring Boot
      # config tree). Không có mật khẩu trong biến môi trường.
      SPRING_CONFIG_IMPORT: configtree:/run/dxos-secrets/flowable/
      FLOWABLE_REST_APP_CREATE-DEMO-DEFINITIONS: "false"
      FLOWABLE_CHECK-PROCESS-DEFINITIONS: "false"
      JAVA_OPTS: -Xmx512M
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - flowable-secrets:/run/dxos-secrets:ro
    ports:
      - "127.0.0.1:${FLOWABLE_PORT:-8090}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      flowable-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Image có wget, base64 (busybox). /actuator/health của flowable-rest bắt Basic auth;
      # mật khẩu đọc từ tệp bí mật của chính container.
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header "Authorization: Basic $$(printf 'rest-admin:%s' "$$(cat /run/dxos-secrets/flowable/flowable.rest.app.admin.password)" | base64)"
          http://127.0.0.1:8080/flowable-rest/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # API một cửa (D-008): mot-cua/backend/main.py, chạy trên image python gốc, chỉ thư viện
  # chuẩn (không build, không cài gói). APISIX chuyển /workflow/* tới đây sau khi kiểm JWT.
  # API quy trình mỏng: gọi Flowable bằng tài khoản kỹ thuật thay người dùng, sau khi tự kiểm
  # quyền (người dùng không cầm mật khẩu Flowable); đọc/ghi hồ sơ qua PostgREST bằng token của
  # người dùng nên RLS áp dụng. Quy trình và biến từng bước của mỗi thủ tục lấy từ danh mục mà
  # nap-thu-tuc ghi (gói thu-tuc/<ma>/), không gắn cứng trong mã.
  # API tệp (/files, #7): quét ClamAV trước khi lưu Garage bằng khóa S3 riêng của bộ máy;
  # metadata ghi bằng tài khoản dịch vụ Keycloak mot_cua_tep.
  # Bí mật (#10): mật khẩu rest-admin, client secret, khóa S3 đọc từ OpenBao lúc cần bằng
  # AppRole `tang2` (volume tang2-secrets chỉ chứa role_id/secret_id), chỉ giữ trong bộ nhớ.
  mot-cua-api:
    # python:3.13.16-alpine3.24 + jsonschema (Poka-yoke phía máy chủ, #59): mot-cua/backend/Dockerfile.
    build:
      context: ./mot-cua/backend
    image: commune-dxos/mot-cua-api:local
    profiles: [core]
    command: ["python", "-u", "/mot-cua/backend/main.py"]
    environment:
      DXOS_TANG2: *tang2
      DXOS_POSTGREST_URL: http://postgrest:3000
      DXOS_FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      DXOS_FLOWABLE_USER: rest-admin
      DXOS_JWKS_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/certs
      # Issuer trong token = KC_HOSTNAME của Keycloak + /realms/dxos
      DXOS_JWT_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/dxos
      DXOS_JWT_AUD: dxos_api
      DXOS_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      DXOS_BAO_ADDR: http://openbao:8200
      DXOS_BAO_APPROLE_DIR: /run/dxos-secrets/approle
      DXOS_CLAMAV_HOST: clamav
      DXOS_CLAMAV_PORT: "3310"
      # Địa chỉ gateway mà client dùng; link tải ký ngắn hạn trỏ về ${DXOS_GATEWAY_URL}/files/s3/…
      DXOS_GATEWAY_URL: ${DXOS_GATEWAY_URL:-http://localhost:9080}
      DXOS_FILE_MAX_BYTES: ${DXOS_FILE_MAX_BYTES:-10485760}
      DXOS_FILE_LINK_TTL: ${DXOS_FILE_LINK_TTL:-300}
      # Ký số giấy tờ (#77): Gotenberg sinh PDF từ mẫu mot-cua/mau-giay-to/, pyHanko ký bằng chứng
      # thư ca-init ghi vào OpenBao. Tên cơ quan in trên giấy tờ = tên trong chứng thư.
      DXOS_GOTENBERG_URL: http://gotenberg:3000
      DXOS_KY_SO_TEN: ${DXOS_KY_SO_TEN:-UBND xã Mẫu – Bộ phận Một cửa}
      # pyHanko (tzlocal) cần múi giờ hệ thống; giờ Việt Nam trên giấy tờ tính bằng offset cố định.
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./mot-cua:/mot-cua:ro
      - tang2-secrets:/run/dxos-secrets:ro
    # Không mở cổng ra host: chỉ APISIX gọi.
    expose:
      - "8000"
    depends_on:
      postgrest:
        condition: service_started
      flowable:
        condition: service_healthy
      tang2-realm:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
      nap-thu-tuc:
        condition: service_completed_successfully
      # ClamAV nạp CSDL virus mất khoảng 1 phút: không chờ. Chưa sẵn sàng thì API tải tệp
      # trả 503 (không bao giờ lưu tệp chưa quét).
      clamav:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Cổng công dân (#57): bản build của mot-cua/web-cong-dan/ (React) do nginx không đặc quyền phục
  # vụ (Dockerfile hai tầng: node build → nginxinc/nginx-unprivileged, uid 101). Không mở cổng ra
  # host: APISIX phục vụ ở route / (http://localhost:9080/), cùng origin với /public, /api, /files,
  # /workflow nên web gọi lõi bằng đường dẫn tương đối. Không có bí mật: Keycloak mà trình duyệt
  # thấy truyền lúc chạy (sinh /cau-hinh.js và CSP). `make up` build lại image khi mã web đổi.
  mot-cua-web:
    build:
      context: ./mot-cua/web-cong-dan
    image: commune-dxos/mot-cua-web:local
    profiles: [core]
    environment:
      DXOS_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      DXOS_KEYCLOAK_REALM: dxos
      DXOS_OIDC_CLIENT_ID: mot_cua_web
      # Cổng cán bộ /can-bo (#55): client public riêng, Keycloak bắt OTP với can_bo, lanh_dao.
      DXOS_OIDC_CLIENT_ID_CAN_BO: mot_cua_can_bo
      # Entrypoint của nginx chỉ thay biến DXOS_* vào nginx/*.template.
      NGINX_ENVSUBST_FILTER: ^DXOS_
    read_only: true
    tmpfs:
      - /tmp
      # Cấu hình nginx sinh từ template lúc khởi động (chủ uid 101).
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Tác vụ nền của bộ máy một cửa (#9): mot-cua/backend/worker.py, cùng image và cùng danh
  # tính OpenBao `tang2` với mot-cua-api, không nhận request nào (không có cổng): phát sự kiện
  # trong hộp thư đi (outbox PostgreSQL) lên RabbitMQ, quét hồ sơ sắp trễ hạn, consumer mẫu ghi
  # nhật ký sự kiện.
  mot-cua-worker:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    command: ["python", "-u", "/mot-cua/backend/worker.py"]
    environment:
      DXOS_TANG2: *tang2
      DXOS_POSTGREST_URL: http://postgrest:3000
      DXOS_FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      DXOS_FLOWABLE_USER: rest-admin
      DXOS_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      DXOS_BAO_ADDR: http://openbao:8200
      DXOS_BAO_APPROLE_DIR: /run/dxos-secrets/approle
      DXOS_SU_KIEN_QUET_GIAY: ${DXOS_SU_KIEN_QUET_GIAY:-300}
      DXOS_SU_KIEN_SAP_TRE_NGAY: ${DXOS_SU_KIEN_SAP_TRE_NGAY:-1}
      DXOS_DOI_SOAT_CHO_GIAY: ${DXOS_DOI_SOAT_CHO_GIAY:-60}
      DXOS_DOI_SOAT_TOI_DA: ${DXOS_DOI_SOAT_TOI_DA:-500}
      DXOS_THONG_BAO_KENH: ${DXOS_THONG_BAO_KENH-email,sms}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./mot-cua:/mot-cua:ro
      - tang2-secrets:/run/dxos-secrets:ro
    depends_on:
      postgrest:
        condition: service_started
      flowable:
        condition: service_healthy
      tang2-realm:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      # worker.py chạm /tmp/song sau mỗi vòng; quá 60 giây không chạm = treo.
      test: ["CMD-SHELL", "[ -n \"$$(find /tmp/song -mmin -1 2>/dev/null)\" ]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Bộ nạp gói thủ tục (D-009): mot-cua/backend/nap_thu_tuc.py quét thu-tuc/*/thu-tuc.yaml,
  # kiểm từng gói (đủ tệp, YAML, JSON Schema, BPMN, dữ liệu mẫu khớp schema), deploy BPMN lên
  # Flowable qua REST (bỏ qua nếu không đổi), ghi danh mục qua PostgREST bằng tài khoản dịch vụ
  # mot_cua_danh_muc (RPC mot_cua.nap_thu_tuc) rồi thoát. Gói lỗi: in lý do, bỏ qua, các gói
  # khác vẫn nạp, mã thoát 0. Mã 1 chỉ khi Flowable hoặc PostgREST không gọi được. Chạy ở mỗi
  # `up` (mot-cua-api chờ nó xong) và bằng tay: make nap-thu-tuc.
  nap-thu-tuc:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    command: ["python", "-u", "/mot-cua/backend/nap_thu_tuc.py", "/thu-tuc"]
    environment:
      DXOS_TANG2: *tang2
      DXOS_POSTGREST_URL: http://postgrest:3000
      DXOS_FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      DXOS_FLOWABLE_USER: rest-admin
      DXOS_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      DXOS_BAO_ADDR: http://openbao:8200
      DXOS_BAO_APPROLE_DIR: /run/dxos-secrets/approle
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./mot-cua:/mot-cua:ro
      - ./thu-tuc:/thu-tuc:ro
      - tang2-secrets:/run/dxos-secrets:ro
    depends_on:
      postgrest:
        condition: service_started
      flowable:
        condition: service_healthy
      tang2-realm:
        condition: service_completed_successfully
      tang2-migrate:
        condition: service_completed_successfully
    restart: "no"

  # --------------------------------------- dữ liệu phi cấu trúc (#7) ----
  # rpc_secret + admin_token của Garage: bao-init sinh trong OpenBao (dxos/core/garage), agent
  # này render ra volume garage-secrets (quyền 0400, chủ root) rồi thoát (#10).
  garage-secrets:
    <<: *bao-agent
    user: "0"
    command: ["-config=/nen-tang/openbao/agent/garage.hcl"]
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - garage-secrets:/run/dxos-secrets

  # Object storage S3 (AGPL-3.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE).
  # Một nút; cấu hình nen-tang/garage/garage.toml. Không mở cổng ra host: S3 (3900) chỉ
  # mot-cua-api gọi bằng khóa riêng, và APISIX /files/s3/* cho link GET đã ký ngắn hạn;
  # API quản trị (3903) chỉ garage-init gọi.
  garage:
    image: dxflrs/garage:v2.4.1
    profiles: [core]
    volumes:
      - ./nen-tang/garage/garage.toml:/etc/garage.toml:ro
      - garage-secrets:/run/garage-secrets:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"
      - "3903"
    depends_on:
      garage-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Image không có shell: dùng CLI của chính Garage (kết nối RPC tới nút cục bộ).
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Cấu hình Garage qua Admin API v2 (layout một nút, bucket trong mot-cua/s3/
  # buckets.conf, khóa S3 riêng của Tầng 2 → OpenBao dxos/tang2/<DXOS_TANG2>/s3) rồi thoát.
  # Idempotent. AppRole garage-init (volume garage-init-secrets chỉ có role_id/secret_id).
  garage-init:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    entrypoint: ["python", "-u", "/nen-tang/scripts/garage-init.py"]
    environment:
      DXOS_TANG2: *tang2
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-10737418240}
      BAO_ADDR: http://openbao:8200
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./nen-tang/scripts:/nen-tang/scripts:ro
      - ./mot-cua:/tang2:ro
      - garage-init-secrets:/run/dxos-secrets:ro
    depends_on:
      garage:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    restart: "no"

  # Quét mã độc (GPL-2.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE). clamd
  # nghe TCP 3310 trong mạng nội bộ; freshclam trong cùng container cập nhật CSDL virus.
  # Image -debian có sẵn CSDL (đa kiến trúc, chạy được trên Mac ARM); volume clamav-db giữ
  # CSDL đã cập nhật nên không tải lại mỗi lần `up`. Cần khoảng 1–1,5 GB RAM.
  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: [core]
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # ------------------------------------------------- bí mật (#10) ----
  # Két sắt bí mật (MPL-2.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE; không
  # dùng HashiCorp Vault – BSL). Chế độ server thường (không -dev), storage raft một nút
  # trong volume bao-data, cấu hình nen-tang/openbao/config.hcl. Không mở cổng ra host, không
  # đi qua APISIX: chỉ dịch vụ trong mạng nội bộ gọi. Quản trị: docker compose exec openbao bao …
  # Khởi động lại thì OpenBao ở trạng thái seal: `make up` (bao-init) unseal lại.
  openbao:
    image: openbao/openbao:2.7.1
    profiles: [core]
    # Entrypoint của image chạy `bao` bằng user openbao (su-exec).
    command: ["bao", "server", "-config=/openbao/config/config.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./nen-tang/openbao/config.hcl:/openbao/config/config.hcl:ro
      - bao-data:/openbao/file
    expose:
      - "8200"
    healthcheck:
      # `bao status` thoát 0 chỉ khi đã khởi tạo và đã unseal.
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Khởi tạo idempotent (nen-tang/openbao/bao-init.py, cũng là `make bao-init`): init lần đầu →
  # unseal key + root token ra BAO_INIT_DIR trên máy (ngoài git, quyền 600), unseal, KV v2,
  # policy, AppRole; bí mật lõi chưa có thì lấy từ .env cũ (chuyển sang OpenBao) hoặc sinh
  # ngẫu nhiên; đặt role_id/secret_id vào volume riêng của từng danh tính. Rồi thoát.
  bao-init:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    entrypoint: ["python", "-u", "/nen-tang/openbao/bao-init.py"]
    environment:
      DXOS_TANG2: *tang2
      BAO_ADDR: http://openbao:8200
      # Một tệp cho mỗi compose project (project tạm không ghi đè khóa của project chính).
      BAO_INIT_FILE: /bao-init/${COMPOSE_PROJECT_NAME:-commune}.json
      BAO_UNSEAL: ${BAO_UNSEAL:-file}
      BAO_KEY_SHARES: ${BAO_KEY_SHARES:-1}
      BAO_KEY_THRESHOLD: ${BAO_KEY_THRESHOLD:-1}
      BAO_IMPORT_ENV: ${BAO_IMPORT_ENV:-auto}
      # Chuyển từ .env cũ (trước #10): chỉ đọc khi bí mật tương ứng CHƯA có trong OpenBao
      # (hoặc BAO_IMPORT_ENV=force). Xóa các dòng này khỏi .env sau khi chuyển.
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      LEGACY_PGRST_DB_PASSWORD: ${PGRST_DB_PASSWORD:-}
      LEGACY_KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      LEGACY_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      LEGACY_FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:-}
      LEGACY_FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./nen-tang/openbao:/nen-tang/openbao:ro
      - ${BAO_INIT_DIR:-./.data/openbao}:/bao-init
      - db-secrets:/vol/db
      - postgrest-secrets:/vol/postgrest
      - keycloak-secrets:/vol/keycloak
      - tang2-realm-secrets:/vol/tang2-realm
      - flowable-secrets:/vol/flowable
      - garage-secrets:/vol/garage
      - garage-init-secrets:/vol/garage-init
      - tang2-secrets:/vol/tang2
      - rabbitmq-secrets:/vol/rabbitmq
      - rabbitmq-init-secrets:/vol/rabbitmq-init
      - step-ca-secrets:/vol/step-ca
      - ca-init-secrets:/vol/ca-init
      - superset-secrets:/vol/superset
    depends_on:
      openbao:
        condition: service_started
    restart: "no"

  # Agent một lần (mẫu x-bao-agent ở đầu tệp). uid = uid của dịch vụ đọc tệp.
  db-secrets:
    <<: *bao-agent
    user: "70"
    command: ["-config=/nen-tang/openbao/agent/db.hcl"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - db-secrets:/run/dxos-secrets

  postgrest-secrets:
    <<: *bao-agent
    user: "1000"
    command: ["-config=/nen-tang/openbao/agent/postgrest.hcl"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commune}
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - postgrest-secrets:/run/dxos-secrets

  keycloak-secrets:
    <<: *bao-agent
    user: "1000"
    command: ["-config=/nen-tang/openbao/agent/keycloak.hcl"]
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - keycloak-secrets:/run/dxos-secrets

  flowable-secrets:
    <<: *bao-agent
    user: "100"
    command: ["-config=/nen-tang/openbao/agent/flowable.hcl"]
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - flowable-secrets:/run/dxos-secrets

  rabbitmq-secrets:
    <<: *bao-agent
    user: "100"
    command: ["-config=/nen-tang/openbao/agent/rabbitmq.hcl"]
    environment:
      RABBITMQ_ADMIN: ${RABBITMQ_ADMIN:-admin}
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - rabbitmq-secrets:/run/dxos-secrets

  # ------------------------------------------- hàng đợi sự kiện (#9) ----
  # Message broker (MPL-2.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE). Một nút;
  # cấu hình nen-tang/rabbitmq/. Plugin: rabbitmq_stomp (Tầng 2 phát/nhận, cổng 61613) và
  # rabbitmq_management (HTTP API quản trị 15672, chỉ rabbitmq-init và người quản trị dùng).
  # Không mở cổng nào ra host, không có route APISIX: chỉ dịch vụ trong mạng nội bộ gọi.
  # Quản trị: docker compose exec rabbitmq rabbitmqctl … Tài khoản quản trị khởi tạo lấy từ
  # OpenBao (agent rabbitmq-secrets), chỉ áp dụng khi volume rabbitmq-data còn trống.
  # hostname cố định: tên nút rabbit@rabbitmq quyết định thư mục dữ liệu, tạo lại container
  # không mất queue và tin nhắn bền vững.
  rabbitmq:
    image: rabbitmq:4.3.6-alpine
    profiles: [core]
    hostname: rabbitmq
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
      RABBITMQ_CONFIG_FILES: /run/dxos-secrets/conf.d
    volumes:
      - ./nen-tang/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./nen-tang/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-secrets:/run/dxos-secrets:ro
      - rabbitmq-data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
      - "61613"
    depends_on:
      rabbitmq-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Nút chạy và mọi listener (AMQP, STOMP, HTTP API) nhận kết nối.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Vhost + user riêng của Tầng 2, topology mot-cua/rabbitmq/definitions.json, thông
  # tin kết nối → OpenBao dxos/tang2/<DXOS_TANG2>/rabbitmq (nen-tang/scripts/rabbitmq-init.py) rồi thoát.
  # Idempotent. AppRole rabbitmq-init (volume rabbitmq-init-secrets chỉ có role_id/secret_id).
  rabbitmq-init:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    entrypoint: ["python", "-u", "/nen-tang/scripts/rabbitmq-init.py"]
    environment:
      DXOS_TANG2: *tang2
      RABBITMQ_ADMIN: ${RABBITMQ_ADMIN:-admin}
      BAO_ADDR: http://openbao:8200
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./nen-tang/scripts:/nen-tang/scripts:ro
      - ./mot-cua:/tang2:ro
      - rabbitmq-init-secrets:/run/dxos-secrets:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    restart: "no"

  # --------------------------------------------- ký số giấy tờ (#77) ----
  # Mật khẩu khóa CA và mật khẩu provisioner: bao-init sinh trong OpenBao (dxos/core/step-ca/*),
  # agent này render ra volume step-ca-secrets (quyền 0400, chủ uid 1000 = user step) rồi thoát.
  step-ca-secrets:
    <<: *bao-agent
    user: "1000"
    command: ["-config=/nen-tang/openbao/agent/step-ca.hcl"]
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - step-ca-secrets:/run/dxos-secrets

  # CA nội bộ của xã (Apache-2.0): dịch vụ riêng, image gốc smallstep/step-ca, không sửa mã. Lần
  # đầu tự khởi tạo CA hai tầng trong volume step-ca-data (khóa mã hóa bằng mật khẩu OpenBao), một
  # provisioner JWK ký tài liệu theo mẫu nen-tang/step-ca/ky-tai-lieu.tpl (nen-tang/scripts/
  # step-ca-start.sh). Không mở cổng ra host, không có route APISIX: chỉ ca-init gọi.
  step-ca:
    image: smallstep/step-ca:0.30.2
    profiles: [core]
    entrypoint: ["/bin/bash", "/nen-tang/scripts/step-ca-start.sh"]
    environment:
      DXOS_CA_TEN: ${DXOS_CA_TEN:-CA nội bộ Commune DX-OS}
      DXOS_KY_SO_THOI_HAN: ${DXOS_KY_SO_THOI_HAN:-8760h}
    volumes:
      - ./nen-tang/scripts/step-ca-start.sh:/nen-tang/scripts/step-ca-start.sh:ro
      - ./nen-tang/step-ca:/nen-tang/step-ca:ro
      - step-ca-secrets:/run/dxos-secrets:ro
      - step-ca-data:/home/step
    expose:
      - "9000"
    depends_on:
      step-ca-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/home/step/certs/root_ca.crt", "https://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Cấp (hoặc gia hạn khi còn dưới 30 ngày) chứng thư ký tài liệu cho dịch vụ Tầng 2, ghi khóa +
  # chứng thư vào OpenBao dxos/tang2/<DXOS_TANG2>/ky-so (nen-tang/scripts/ca-init.sh) rồi thoát.
  # Idempotent. AppRole ca-init (volume ca-init-secrets chỉ có role_id/secret_id); đọc root CA từ
  # volume step-ca-data chỉ đọc.
  ca-init:
    image: smallstep/step-ca:0.30.2
    profiles: [core]
    entrypoint: ["/bin/bash", "/nen-tang/scripts/ca-init.sh"]
    environment:
      DXOS_TANG2: *tang2
      DXOS_KY_SO_TEN: ${DXOS_KY_SO_TEN:-UBND xã Mẫu – Bộ phận Một cửa}
      DXOS_KY_SO_THOI_HAN: ${DXOS_KY_SO_THOI_HAN:-8760h}
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./nen-tang/scripts/ca-init.sh:/nen-tang/scripts/ca-init.sh:ro
      - ca-init-secrets:/run/dxos-secrets:ro
      - step-ca-data:/ca:ro
    depends_on:
      step-ca:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  # Sinh PDF từ HTML (MIT): dịch vụ riêng, image gốc bản chỉ có Chromium, không sửa mã. Chỉ
  # mot-cua-api gọi (không mở cổng, không route APISIX). Chromium không được tải gì từ mạng (mẫu
  # giấy tờ tự chứa), không chạy JavaScript; tắt webhook và downloadFrom (chống SSRF).
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    profiles: [core]
    command:
      - gotenberg
      - --api-timeout=30s
      - --api-disable-health-check-logging
      - --api-disable-download-from
      - --webhook-disable
      - --chromium-disable-javascript
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------- docs – TODO tuần 5 ----
  # meilisearch: # Chỉ Community Edition (MIT), không bật tính năng Enterprise (D-004)

  # ------------------------------------------- kho dữ liệu lịch sử (#80) ----
  # Dịch vụ một lần của bộ máy (mot-cua/kho-du-lieu/chay.py), chạy tay hoặc theo lịch máy chủ:
  # make kho-du-lieu (= docker compose --profile core --profile bi run --rm --no-deps kho-du-lieu). Đọc hồ sơ đã đóng qua
  # PostgREST bằng tài khoản dịch vụ mot_cua_bao_cao (secret ở OpenBao, AppRole tang2 như
  # mot-cua-worker) → Parquet khử định danh trong volume kho-du-lieu → dbt-core + DuckDB build mart +
  # docs (lineage) → RPC nap_bao_cao đẩy mart về schema bao_cao cho Superset. Không mở cổng.
  kho-du-lieu:
    build:
      context: ./mot-cua/kho-du-lieu
    image: commune-dxos/kho-du-lieu:local
    profiles: [bi]
    command: ["python", "-u", "/mot-cua/kho-du-lieu/chay.py"]
    environment:
      DXOS_TANG2: *tang2
      DXOS_POSTGREST_URL: http://postgrest:3000
      DXOS_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      DXOS_BAO_ADDR: http://openbao:8200
      DXOS_BAO_APPROLE_DIR: /run/dxos-secrets/approle
      DXOS_KHO_DIR: /kho
    volumes:
      - ./mot-cua:/mot-cua:ro
      - tang2-secrets:/run/dxos-secrets:ro
      - kho-du-lieu:/kho
    # Không depends_on: dịch vụ của profile core (PostgREST, Keycloak, OpenBao) phải đang chạy
    # (make up trước); khai phụ thuộc chéo profile thì `--profile bi` một mình không hợp lệ.
    restart: "no"

  # ---------------------------------------------------- Superset (#82) ----
  # SECRET_KEY, mật khẩu role metadata `superset` và role đọc báo cáo `bao_cao_doc` (bao-init sinh trong
  # OpenBao) → volume superset-secrets, quyền 0400, chủ uid 1000 (user superset).
  superset-secrets:
    <<: *bao-agent
    profiles: [bi]
    user: "1000"
    command: ["-config=/nen-tang/openbao/agent/superset.hcl"]
    volumes:
      - ./nen-tang/openbao/agent:/nen-tang/openbao/agent:ro
      - superset-secrets:/run/dxos-secrets

  # Một lần (nen-tang/superset/superset-init.sh): nâng lược đồ metadata, vai trò mặc định, rồi dựng
  # kết nối, dataset, chart, dashboard của Tầng 2 bằng mã (mot-cua/bao-cao/superset_dung.py).
  superset-init:
    <<: *superset
    entrypoint: ["/bin/bash", "/nen-tang/superset/superset-init.sh"]
    # CSDL superset, role bao_cao_doc (db-init) và schema bao_cao (migration Tầng 2) phải có trước.
    depends_on:
      superset-secrets:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      tang2-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  superset:
    <<: *superset
    command: ["/usr/bin/run-server.sh"]
    environment:
      <<: *superset-env
      # Một tiến trình (20 luồng): cache trong bộ nhớ (không Redis) dùng chung cho mọi request.
      SERVER_WORKER_AMOUNT: "1"
    expose:
      - "8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/bao-cao/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------- ai – TODO ----
  # ollama:      # profile ai; model Qwen2.5 7B/14B (Apache-2.0), không dùng bản 3B (D-004)

volumes:
  pg-data:
  jwks:
  garage-meta:
  garage-data:
  clamav-db:
  # OpenBao (#10): dữ liệu raft (đã mã hóa) và volume riêng của từng danh tính
  # (role_id/secret_id + tệp bí mật agent render). Mất bao-data = mất mọi bí mật.
  bao-data:
  db-secrets:
  postgrest-secrets:
  keycloak-secrets:
  tang2-realm-secrets:
  flowable-secrets:
  garage-secrets:
  garage-init-secrets:
  tang2-secrets:
  rabbitmq-secrets:
  rabbitmq-init-secrets:
  # RabbitMQ (#9): CSDL của nút (user, vhost, queue, tin nhắn bền vững).
  rabbitmq-data:
  # step-ca (#77): cấu hình CA, root + intermediate (khóa đã mã hóa), CSDL chứng thư đã cấp.
  # Mất volume này = CA mới: ca-init cấp lại chứng thư theo root mới; PDF đã ký bằng CA cũ vẫn
  # toàn vẹn nhưng không còn tin cậy khi xác minh. Sao lưu volume này cùng OpenBao.
  step-ca-data:
  # Kho dữ liệu (#80): Parquet đã khử định danh, kho.duckdb của dbt, target/ (docs, lineage), log dbt.
  # Dựng lại được hoàn toàn bằng make kho-du-lieu (nguồn đúng là PostgreSQL).
  kho-du-lieu:
  superset-secrets:
  step-ca-secrets:
  ca-init-secrets:
