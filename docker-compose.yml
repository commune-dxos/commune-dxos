# Commune DX-OS – lõi Tầng 1 (headless) + ứng dụng Tầng 2 cắm vào. Sơ đồ: docs/architecture.md
#
# Lõi (cấu hình trong core/) không chứa nghiệp vụ. Ứng dụng được chọn bằng DXOS_APP
# trong .env; lõi chỉ biết quy ước thư mục apps/<DXOS_APP>/:
#   app.env              cấu hình PostgREST của ứng dụng (schema phơi ra API)
#   db/migrations/*.sql  schema, role, RLS  → dịch vụ một lần app-migrate
#   db/seed/*.sql        dữ liệu giả        → app-migrate khi DXOS_SEED=true
#   keycloak/realm.json  vai trò, nhóm, client, người dùng mẫu → dịch vụ một lần app-realm
#   processes/*.bpmn20.xml  quy trình BPMN 2.0 → Flowable tự triển khai khi khởi động
#   backend/main.py      backend riêng của ứng dụng (D-008) → dịch vụ app-backend, APISIX /workflow/*, /files/*
#   s3/buckets.conf      bucket S3 ứng dụng cần → dịch vụ một lần garage-init tạo bucket + khóa riêng
#
# Profile:
#   core : PostgreSQL, Keycloak, APISIX, PostgREST   (tuần 1, v0.0.1)
#          + Flowable REST (workflow, #8), app-backend (/workflow, #6)
#          + Garage (S3) và ClamAV (quét tệp trước khi lưu) (#7)
#          + OpenBao giữ mọi bí mật dịch vụ (#10)
#          + RabbitMQ                                 (tuần 2, đang là TODO bên dưới)
#   docs : Gotenberg, step-ca, Meilisearch CE         (tuần 2–5)
#   ai   : Ollama + Qwen2.5 7B, OCR                   (tuần 5)
#   bi   : Apache Superset                            (tuần 4)
#
# Bí mật (#10, docs/architecture.md §4.4): KHÔNG có mật khẩu, khóa hay token nào trong repo
# hay .env. OpenBao (KV v2 `dxos/`) là nguồn duy nhất; bao-init khởi tạo/unseal và nạp bí
# mật lõi, mỗi dịch vụ một AppRole với policy chỉ đọc đúng phần của mình
# (core/openbao/policies/). Dịch vụ lấy bí mật theo hai cách:
#   - image không tự gọi HTTP được (PostgreSQL, PostgREST, Keycloak, Flowable, Garage):
#     agent một lần `<danh tính>-secrets` render tệp quyền 0400 vào volume riêng
#     `<danh tính>-secrets`, dịch vụ mount chỉ đọc;
#   - app-realm, garage-init, app-backend: tự đăng nhập AppRole và đọc/ghi qua HTTP API,
#     volume riêng chỉ chứa role_id/secret_id.
#
# Quy tắc: ghim phiên bản image cụ thể (không dùng `latest`), image lấy từ dự án gốc,
# mọi dịch vụ có healthcheck, cấu hình qua .env (mẫu: .env.example).

name: commune

# Mẫu chung của agent OpenBao một lần (#10): đăng nhập AppRole của danh tính, render bí mật
# theo core/openbao/agent/<danh tính>.hcl vào volume của danh tính rồi thoát (mã 1 nếu policy
# chặn hay OpenBao seal). Chạy lại ở mỗi `up`, nên đổi bí mật trong OpenBao rồi `make up` là
# dịch vụ nhận giá trị mới khi khởi động lại.
x-bao-agent: &bao-agent
  image: openbao/openbao:2.7.1
  profiles: [core]
  entrypoint: ["bao", "agent"]
  depends_on:
    bao-init:
      condition: service_completed_successfully
  healthcheck:
    disable: true
  restart: "no"

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    image: postgres:17.6-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commune}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Mật khẩu superuser (chỉ dùng khi initdb volume trống) từ OpenBao, agent db-secrets.
      POSTGRES_PASSWORD_FILE: /run/dxos-secrets/postgres_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./core/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - db-secrets:/run/dxos-secrets:ro
    ports:
      # Chỉ mở trên máy local để debug bằng psql; Tầng 2 không gọi thẳng CSDL.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    depends_on:
      db-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [core]
    # start-dev: HTTP, phù hợp chạy local. Triển khai thật dùng `start` + TLS.
    # kc-start.sh đọc mật khẩu CSDL và quản trị khởi tạo từ volume keycloak-secrets (OpenBao).
    entrypoint: ["/bin/bash", "/core/scripts/kc-start.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      # Issuer cố định theo địa chỉ trình duyệt dùng; APISIX/PostgREST gọi nội bộ
      # qua http://keycloak:8080 nhờ backchannel động.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./core/keycloak/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
      - ./core/scripts/kc-start.sh:/core/scripts/kc-start.sh:ro
      - keycloak-secrets:/run/dxos-secrets:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Image không có curl: dùng /dev/tcp của bash gọi cổng quản trị 9000.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Lấy khóa công khai (JWKS) của realm cho PostgREST rồi thoát.
  # Dùng lại image postgres (đã có wget của busybox) để không kéo thêm image.
  jwks-init:
    image: postgres:17.6-alpine
    profiles: [core]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        wget -qO /jwks/jwks.json http://keycloak:8080/realms/dxos/protocol/openid-connect/certs && exit 0;
        sleep 2; done; echo 'Không lấy được JWKS từ Keycloak' >&2; exit 1
    volumes:
      - jwks:/jwks
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /jwks/jwks.json"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"

  # Áp dụng migration + seed SQL của ứng dụng (core/scripts/app-migrate.sh) rồi thoát.
  # Chạy lại an toàn: tệp đã áp dụng được bỏ qua. Chạy tay: make migrate.
  app-migrate:
    image: postgres:17.6-alpine
    profiles: [core]
    entrypoint: ["/bin/sh", "/core/scripts/app-migrate.sh"]
    environment:
      DXOS_APP: ${DXOS_APP:?Đặt DXOS_APP trong .env (tên thư mục trong apps/)}
      DXOS_SEED: ${DXOS_SEED:-false}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-commune}
      PGPASSFILE: /run/dxos-secrets/pgpass
    volumes:
      - ./core/scripts:/core/scripts:ro
      - ./apps/${DXOS_APP:?Đặt DXOS_APP trong .env}:/app:ro
      - db-secrets:/run/dxos-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Nạp vai trò, nhóm, client, người dùng mẫu của ứng dụng vào realm lõi `dxos`
  # (Keycloak Partial Import, bỏ qua đối tượng đã có) rồi thoát. Dùng lại image Keycloak.
  # Mật khẩu quản trị Keycloak đọc từ OpenBao; client secret của client dịch vụ (service
  # account) ghi vào OpenBao (AppRole app-realm, volume app-realm-secrets chỉ có role_id/
  # secret_id). Chạy bằng root để đọc được tệp AppRole (chủ root, quyền 0400).
  app-realm:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [core]
    user: "0"
    entrypoint: ["/bin/bash", "/core/scripts/app-realm.sh"]
    environment:
      DXOS_APP: ${DXOS_APP:?Đặt DXOS_APP trong .env}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./core/scripts:/core/scripts:ro
      - ./apps/${DXOS_APP:?Đặt DXOS_APP trong .env}:/app:ro
      - app-realm-secrets:/run/dxos-secrets:ro
    depends_on:
      keycloak:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v13.0.4
    profiles: [core]
    environment:
      # URI kết nối (chứa mật khẩu authenticator) đọc từ tệp do agent postgrest-secrets render.
      PGRST_DB_URI: "@/run/dxos-secrets/db-uri"
      # PGRST_DB_SCHEMAS lấy từ apps/<DXOS_APP>/app.env (env_file bên dưới).
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      PGRST_JWT_AUD: dxos_api
      # Mỗi người dùng có đúng một client role của dxos_api (ứng dụng khai báo),
      # trùng tên role PostgreSQL → PostgREST SET ROLE → RLS áp dụng.
      PGRST_JWT_ROLE_CLAIM_KEY: .resource_access.dxos_api.roles[0]
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_LOG_LEVEL: info
      # OpenAPI ở gốc /api/ và /public/ chỉ liệt kê bảng, cột mà role của request được quyền
      # (anon thấy danh mục công khai) – không lộ cấu trúc ngoài quyền của người gọi.
      PGRST_OPENAPI_MODE: follow-privileges
      # Chặn trên số dòng mỗi response, tránh một request đọc cả bảng lớn.
      PGRST_DB_MAX_ROWS: "1000"
      # PostgREST mặc định cho mọi origin; giới hạn giống CORS của APISIX.
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${DXOS_CORS_ORIGINS:-http://localhost:5173}
    env_file:
      - ./apps/${DXOS_APP:?Đặt DXOS_APP trong .env}/app.env
    volumes:
      - jwks:/jwks:ro
      - postgrest-secrets:/run/dxos-secrets:ro
    # Không mở cổng ra host: Tầng 2 chỉ đi qua APISIX.
    expose:
      - "3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgrest-secrets:
        condition: service_completed_successfully
      jwks-init:
        condition: service_completed_successfully
      app-migrate:
        condition: service_completed_successfully
    # Không dùng healthcheck của Docker: image amd64 dựng FROM scratch (không có shell)
    # và v13.0.4 chưa có cờ `--ready` (đã chạy thử 17/10/2026). Thay vào đó APISIX
    # kiểm chủ động http://postgrest:3001/ready (xem upstream trong core/apisix/apisix.yaml).
    healthcheck:
      disable: true
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.13.0-debian
    profiles: [core]
    # Chế độ standalone khai báo trong config.yaml (không đặt APISIX_STAND_ALONE,
    # vì entrypoint sẽ ghi đè config.yaml đã mount).
    environment:
      # Nguồn (origin) web của Tầng 2 được gọi API từ trình duyệt, cách nhau bởi dấu phẩy.
      # Đọc trong core/apisix/apisix.yaml bằng ${{DXOS_CORS_ORIGINS}}.
      DXOS_CORS_ORIGINS: ${DXOS_CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./core/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./core/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_PORT:-9080}:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      postgrest:
        condition: service_started
      app-realm:
        condition: service_completed_successfully
      app-backend:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9080'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Role đăng nhập + CSDL riêng của dịch vụ lõi (authenticator, keycloak, flowable), mật
  # khẩu theo OpenBao (core/scripts/db-init.sh), rồi thoát. Chạy mỗi lần `up`, không lỗi
  # nếu đã có, nên dùng được với volume cũ và đổi mật khẩu trong OpenBao là PostgreSQL theo.
  # Thay flowable-db-init và initdb/20-auth.sh (#10). Dùng lại image postgres.
  db-init:
    image: postgres:17.6-alpine
    profiles: [core]
    entrypoint: ["/bin/sh", "/core/scripts/db-init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-commune}
      PGPASSFILE: /run/dxos-secrets/pgpass
    volumes:
      - ./core/scripts:/core/scripts:ro
      - db-secrets:/run/dxos-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Workflow engine BPMN 2.0 (Apache-2.0). Chỉ dùng flowable-rest (D-004): không có modeler,
  # BPMN viết XML tay trong apps/<DXOS_APP>/processes/. Flowable tự triển khai các tệp
  # *.bpmn20.xml ở đó khi khởi động (bỏ qua tệp không đổi), tắt quy trình demo của image.
  # REST API: http://flowable:8080/flowable-rest/service (Basic auth tài khoản rest-admin).
  # Tầng 2 không gọi thẳng: APISIX /workflow/* → app-backend → Flowable (#6). Cổng host chỉ
  # mở trên 127.0.0.1 để debug/smoke; API quản trị không đi qua gateway.
  flowable:
    image: flowable/flowable-rest:8.0.0
    profiles: [core]
    environment:
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "10"
      FLOWABLE_REST_APP_ADMIN_USER-ID: rest-admin
      # spring.datasource.password và flowable.rest.app.admin.password: mỗi thuộc tính một tệp
      # (tên tệp = tên thuộc tính) do agent flowable-secrets render từ OpenBao (Spring Boot
      # config tree). Không có mật khẩu trong biến môi trường.
      SPRING_CONFIG_IMPORT: configtree:/run/dxos-secrets/flowable/
      FLOWABLE_REST_APP_CREATE-DEMO-DEFINITIONS: "false"
      FLOWABLE_PROCESS-DEFINITION-LOCATION-PREFIX: file:/dxos/processes/
      JAVA_OPTS: -Xmx512M
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./apps/${DXOS_APP:?Đặt DXOS_APP trong .env}/processes:/dxos/processes:ro
      - flowable-secrets:/run/dxos-secrets:ro
    ports:
      - "127.0.0.1:${FLOWABLE_PORT:-8090}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      flowable-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Image có wget, base64 (busybox). /actuator/health của flowable-rest bắt Basic auth;
      # mật khẩu đọc từ tệp bí mật của chính container.
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header "Authorization: Basic $$(printf 'rest-admin:%s' "$$(cat /run/dxos-secrets/flowable/flowable.rest.app.admin.password)" | base64)"
          http://127.0.0.1:8080/flowable-rest/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # Backend riêng của ứng dụng (D-008): apps/<DXOS_APP>/backend/main.py, chạy trên image
  # python gốc, chỉ thư viện chuẩn (không build, không cài gói). APISIX chuyển /workflow/*
  # tới đây sau khi kiểm JWT. Với mot-cua: API quy trình mỏng – gọi Flowable bằng tài
  # khoản kỹ thuật thay người dùng, sau khi tự kiểm quyền (người dùng không cầm mật khẩu
  # Flowable); đọc/ghi hồ sơ qua PostgREST bằng token của người dùng nên RLS áp dụng.
  # Ứng dụng không có backend/main.py thì dịch vụ chỉ chạy chỗ giữ và /workflow trả 502.
  # API tệp (/files, #7): quét ClamAV trước khi lưu Garage bằng khóa S3 riêng của ứng dụng;
  # metadata ghi bằng tài khoản dịch vụ Keycloak của ứng dụng.
  # Bí mật (#10): mật khẩu rest-admin, client secret, khóa S3 đọc từ OpenBao lúc cần bằng
  # AppRole `app` (volume app-secrets chỉ chứa role_id/secret_id), chỉ giữ trong bộ nhớ.
  app-backend:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    command:
      - sh
      - -c
      - >-
        [ -f /app/backend/main.py ] && exec python -u /app/backend/main.py;
        echo "apps/$$DXOS_APP không có backend/main.py"; exec sleep infinity
    environment:
      DXOS_APP: ${DXOS_APP:?Đặt DXOS_APP trong .env}
      DXOS_POSTGREST_URL: http://postgrest:3000
      DXOS_FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      DXOS_FLOWABLE_USER: rest-admin
      DXOS_JWKS_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/certs
      # Issuer trong token = KC_HOSTNAME của Keycloak + /realms/dxos
      DXOS_JWT_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/dxos
      DXOS_JWT_AUD: dxos_api
      DXOS_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      DXOS_BAO_ADDR: http://openbao:8200
      DXOS_BAO_APPROLE_DIR: /run/dxos-secrets/approle
      DXOS_CLAMAV_HOST: clamav
      DXOS_CLAMAV_PORT: "3310"
      # Địa chỉ gateway mà client dùng; link tải ký ngắn hạn trỏ về ${DXOS_GATEWAY_URL}/files/s3/…
      DXOS_GATEWAY_URL: ${DXOS_GATEWAY_URL:-http://localhost:9080}
      DXOS_FILE_MAX_BYTES: ${DXOS_FILE_MAX_BYTES:-10485760}
      DXOS_FILE_LINK_TTL: ${DXOS_FILE_LINK_TTL:-300}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/${DXOS_APP:?Đặt DXOS_APP trong .env}:/app:ro
      - app-secrets:/run/dxos-secrets:ro
    # Không mở cổng ra host: chỉ APISIX gọi.
    expose:
      - "8000"
    depends_on:
      postgrest:
        condition: service_started
      flowable:
        condition: service_healthy
      app-realm:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
      # ClamAV nạp CSDL virus mất khoảng 1 phút: không chờ. Chưa sẵn sàng thì API tải tệp
      # trả 503 (không bao giờ lưu tệp chưa quét).
      clamav:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ ! -f /app/backend/main.py ] ||
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --------------------------------------- dữ liệu phi cấu trúc (#7) ----
  # rpc_secret + admin_token của Garage: bao-init sinh trong OpenBao (dxos/core/garage), agent
  # này render ra volume garage-secrets (quyền 0400, chủ root) rồi thoát (#10).
  garage-secrets:
    <<: *bao-agent
    user: "0"
    command: ["-config=/core/openbao/agent/garage.hcl"]
    volumes:
      - ./core/openbao/agent:/core/openbao/agent:ro
      - garage-secrets:/run/dxos-secrets

  # Object storage S3 (AGPL-3.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE).
  # Một nút; cấu hình core/garage/garage.toml. Không mở cổng ra host: S3 (3900) chỉ
  # app-backend gọi bằng khóa riêng, và APISIX /files/s3/* cho link GET đã ký ngắn hạn;
  # API quản trị (3903) chỉ garage-init gọi.
  garage:
    image: dxflrs/garage:v2.4.1
    profiles: [core]
    volumes:
      - ./core/garage/garage.toml:/etc/garage.toml:ro
      - garage-secrets:/run/garage-secrets:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"
      - "3903"
    depends_on:
      garage-secrets:
        condition: service_completed_successfully
    healthcheck:
      # Image không có shell: dùng CLI của chính Garage (kết nối RPC tới nút cục bộ).
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Cấu hình Garage qua Admin API v2 (layout một nút, bucket trong apps/<DXOS_APP>/s3/
  # buckets.conf, khóa S3 riêng của ứng dụng → OpenBao dxos/apps/<DXOS_APP>/s3) rồi thoát.
  # Idempotent. AppRole garage-init (volume garage-init-secrets chỉ có role_id/secret_id).
  garage-init:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    entrypoint: ["python", "-u", "/core/scripts/garage-init.py"]
    environment:
      DXOS_APP: ${DXOS_APP:?Đặt DXOS_APP trong .env}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-10737418240}
      BAO_ADDR: http://openbao:8200
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./core/scripts:/core/scripts:ro
      - ./apps/${DXOS_APP:?Đặt DXOS_APP trong .env}:/app:ro
      - garage-init-secrets:/run/dxos-secrets:ro
    depends_on:
      garage:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    restart: "no"

  # Quét mã độc (GPL-2.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE). clamd
  # nghe TCP 3310 trong mạng nội bộ; freshclam trong cùng container cập nhật CSDL virus.
  # Image -debian có sẵn CSDL (đa kiến trúc, chạy được trên Mac ARM); volume clamav-db giữ
  # CSDL đã cập nhật nên không tải lại mỗi lần `up`. Cần khoảng 1–1,5 GB RAM.
  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: [core]
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # ------------------------------------------------- bí mật (#10) ----
  # Két sắt bí mật (MPL-2.0): dịch vụ riêng, image gốc, không sửa mã (D-004, NOTICE; không
  # dùng HashiCorp Vault – BSL). Chế độ server thường (không -dev), storage raft một nút
  # trong volume bao-data, cấu hình core/openbao/config.hcl. Không mở cổng ra host, không
  # đi qua APISIX: chỉ dịch vụ trong mạng nội bộ gọi. Quản trị: docker compose exec openbao bao …
  # Khởi động lại thì OpenBao ở trạng thái seal: `make up` (bao-init) unseal lại.
  openbao:
    image: openbao/openbao:2.7.1
    profiles: [core]
    # Entrypoint của image chạy `bao` bằng user openbao (su-exec).
    command: ["bao", "server", "-config=/openbao/config/config.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./core/openbao/config.hcl:/openbao/config/config.hcl:ro
      - bao-data:/openbao/file
    expose:
      - "8200"
    healthcheck:
      # `bao status` thoát 0 chỉ khi đã khởi tạo và đã unseal.
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Khởi tạo idempotent (core/openbao/bao-init.py, cũng là `make bao-init`): init lần đầu →
  # unseal key + root token ra BAO_INIT_DIR trên máy (ngoài git, quyền 600), unseal, KV v2,
  # policy, AppRole; bí mật lõi chưa có thì lấy từ .env cũ (chuyển sang OpenBao) hoặc sinh
  # ngẫu nhiên; đặt role_id/secret_id vào volume riêng của từng danh tính. Rồi thoát.
  bao-init:
    image: python:3.13.16-alpine3.24
    profiles: [core]
    entrypoint: ["python", "-u", "/core/openbao/bao-init.py"]
    environment:
      DXOS_APP: ${DXOS_APP:?Đặt DXOS_APP trong .env}
      BAO_ADDR: http://openbao:8200
      # Một tệp cho mỗi compose project (project tạm không ghi đè khóa của project chính).
      BAO_INIT_FILE: /bao-init/${COMPOSE_PROJECT_NAME:-commune}.json
      BAO_UNSEAL: ${BAO_UNSEAL:-file}
      BAO_KEY_SHARES: ${BAO_KEY_SHARES:-1}
      BAO_KEY_THRESHOLD: ${BAO_KEY_THRESHOLD:-1}
      BAO_IMPORT_ENV: ${BAO_IMPORT_ENV:-auto}
      # Chuyển từ .env cũ (trước #10): chỉ đọc khi bí mật tương ứng CHƯA có trong OpenBao
      # (hoặc BAO_IMPORT_ENV=force). Xóa các dòng này khỏi .env sau khi chuyển.
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      LEGACY_PGRST_DB_PASSWORD: ${PGRST_DB_PASSWORD:-}
      LEGACY_KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      LEGACY_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      LEGACY_FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:-}
      LEGACY_FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./core/openbao:/core/openbao:ro
      - ${BAO_INIT_DIR:-./.data/openbao}:/bao-init
      - db-secrets:/vol/db
      - postgrest-secrets:/vol/postgrest
      - keycloak-secrets:/vol/keycloak
      - app-realm-secrets:/vol/app-realm
      - flowable-secrets:/vol/flowable
      - garage-secrets:/vol/garage
      - garage-init-secrets:/vol/garage-init
      - app-secrets:/vol/app
    depends_on:
      openbao:
        condition: service_started
    restart: "no"

  # Agent một lần (mẫu x-bao-agent ở đầu tệp). uid = uid của dịch vụ đọc tệp.
  db-secrets:
    <<: *bao-agent
    user: "70"
    command: ["-config=/core/openbao/agent/db.hcl"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - ./core/openbao/agent:/core/openbao/agent:ro
      - db-secrets:/run/dxos-secrets

  postgrest-secrets:
    <<: *bao-agent
    user: "1000"
    command: ["-config=/core/openbao/agent/postgrest.hcl"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commune}
    volumes:
      - ./core/openbao/agent:/core/openbao/agent:ro
      - postgrest-secrets:/run/dxos-secrets

  keycloak-secrets:
    <<: *bao-agent
    user: "1000"
    command: ["-config=/core/openbao/agent/keycloak.hcl"]
    volumes:
      - ./core/openbao/agent:/core/openbao/agent:ro
      - keycloak-secrets:/run/dxos-secrets

  flowable-secrets:
    <<: *bao-agent
    user: "100"
    command: ["-config=/core/openbao/agent/flowable.hcl"]
    volumes:
      - ./core/openbao/agent:/core/openbao/agent:ro
      - flowable-secrets:/run/dxos-secrets

  # ------------------------------------------------- core – TODO tuần 2 ----
  # Bật từng dịch vụ khi làm việc tương ứng trong docs/PLAN.md tuần 2.
  # Kiểm tra lại tag mới nhất trên trang dự án trước khi ghim.
  #
  # rabbitmq:    # Hàng đợi sự kiện, MPL-2.0
  #   image: rabbitmq:<tag>-management-alpine
  #   profiles: [core]

  # ------------------------------------------------- docs – TODO tuần 2–5 ----
  # gotenberg:   # MIT, gotenberg/gotenberg
  # step-ca:     # Apache-2.0, smallstep/step-ca
  # meilisearch: # Chỉ Community Edition (MIT), không bật tính năng Enterprise (D-004)

  # --------------------------------------------------- ai / bi – TODO ----
  # ollama:      # profile ai; model Qwen2.5 7B/14B (Apache-2.0), không dùng bản 3B (D-004)
  # superset:    # profile bi; apache/superset

volumes:
  pg-data:
  jwks:
  garage-meta:
  garage-data:
  clamav-db:
  # OpenBao (#10): dữ liệu raft (đã mã hóa) và volume riêng của từng danh tính
  # (role_id/secret_id + tệp bí mật agent render). Mất bao-data = mất mọi bí mật.
  bao-data:
  db-secrets:
  postgrest-secrets:
  keycloak-secrets:
  app-realm-secrets:
  flowable-secrets:
  garage-secrets:
  garage-init-secrets:
  app-secrets:
