# Route của API Gateway (standalone). APISIX nạp lại tệp này khi thay đổi.
# Tầng 2 chỉ gọi lõi qua đây; PostgREST, Flowable và backend của ứng dụng không mở cổng ra
# ngoài (Flowable chỉ có cổng debug trên 127.0.0.1).
# Route của lõi không nêu tên bảng hay tài nguyên nghiệp vụ nào: tài nguyên nào công
# khai, ai được đọc/ghi gì do quyền và RLS trong migration của ứng dụng quyết định;
# endpoint quy trình do backend của ứng dụng (dịch vụ app-backend) quyết định.
#
# | Route         | Xác thực        | Đích                         | Giới hạn            |
# |---------------|-----------------|------------------------------|---------------------|
# | /public/*     | không (anon)    | PostgREST, chỉ GET/HEAD      | 60 req/phút/IP      |
# | /api/*        | JWT Keycloak    | PostgREST (RLS theo role)    | 600 req/phút/IP     |
# | /workflow/*   | JWT Keycloak    | app-backend → Flowable REST  | 300 req/phút/IP     |
# | /files/*      | JWT Keycloak    | app-backend (API tệp, #7)    | 120 req/phút/IP,    |
# |               |                 |                              | body ≤ 10 MiB       |
# | /files/s3/*   | chữ ký trong URL| Garage S3, chỉ GET/HEAD      | 120 req/phút/IP     |
# Đường dẫn API quản trị Flowable (repository, management, identity…) bị chặn 403 ở
# gateway, kể cả khi sau này ứng dụng chọn chuyển tiếp thẳng tới Flowable.

upstreams:
  - id: postgrest
    type: roundrobin
    nodes:
      "postgrest:3000": 1
    # Kiểm chủ động admin server của PostgREST (cổng 3001, /ready = đã nối CSDL và nạp schema).
    checks:
      active:
        type: http
        http_path: /ready
        port: 3001
        healthy:
          interval: 5
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 2

  # Backend riêng của ứng dụng DXOS_APP (tên dịch vụ chung, không gắn tên nghiệp vụ).
  - id: app-backend
    type: roundrobin
    nodes:
      "app-backend:8000": 1

  # API S3 của Garage (object storage của lõi). Chỉ dùng cho link GET đã ký sẵn.
  - id: garage-s3
    type: roundrobin
    nodes:
      "garage:3900": 1

# Kiểm access token Keycloak (realm dxos), dùng chung cho mọi route cần đăng nhập.
# APISIX kiểm chữ ký bằng JWKS, hạn, issuer; phía sau (PostgREST, app-backend) kiểm lại.
plugin_configs:
  - id: jwt-dxos
    plugins:
      openid-connect:
        client_id: dxos_api
        # Schema plugin bắt buộc trường này, nhưng với bearer_only + use_jwks
        # APISIX không gọi introspection nên giá trị không được dùng. Không phải bí mật.
        client_secret: khong-dung-o-che-do-bearer-only
        discovery: http://keycloak:8080/realms/dxos/.well-known/openid-configuration
        realm: dxos
        bearer_only: true
        use_jwks: true

# CORS cho web Tầng 2 (trình duyệt). Origin lấy từ biến môi trường DXOS_CORS_ORIGINS
# (docker-compose.yml, .env), cách nhau bởi dấu phẩy. Origin lạ không nhận header CORS.
global_rules:
  - id: cors
    plugins:
      cors:
        allow_origins: "${{DXOS_CORS_ORIGINS}}"
        allow_methods: "GET,HEAD,POST,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Prefer,Range,Accept,Accept-Profile,Content-Profile"
        expose_headers: "Content-Range,Content-Location,Location,X-RateLimit-Limit,X-RateLimit-Remaining"
        max_age: 600

routes:
  # Đọc công khai, không cần token: luôn chạy với role PostgreSQL `anon` (header
  # Authorization bị bỏ), chỉ GET/HEAD, giới hạn tần suất chặt cho cổng công dân.
  # Ví dụ: /public/thu_tuc → bảng mà ứng dụng đã GRANT SELECT cho anon.
  - id: public-anon
    uri: /public/*
    methods: [GET, HEAD, OPTIONS]
    priority: 10
    plugins:
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: '{"loi":"Vượt giới hạn 60 request/phút, thử lại sau"}'
        policy: local
      proxy-rewrite:
        regex_uri: ["^/public/(.*)", "/$1"]
        headers:
          remove: [Authorization]
    upstream_id: postgrest

  # Dữ liệu có cấu trúc của ứng dụng: bắt buộc access token. PostgREST kiểm lại token
  # rồi SET ROLE theo claim resource_access.dxos_api.roles[0] để RLS áp dụng.
  - id: api-jwt
    uri: /api/*
    priority: 0
    plugin_config_id: jwt-dxos
    plugins:
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        regex_uri: ["^/api/(.*)", "/$1"]
    upstream_id: postgrest

  # Chặn API quản trị của Flowable REST từ ngoài (triển khai quy trình, quản trị engine,
  # người dùng/nhóm, truy vấn tùy ý), không cần biết backend phía sau là gì.
  - id: workflow-chan-quan-tri
    uris:
      - /workflow/repository/*
      - /workflow/management/*
      - /workflow/identity/*
      - /workflow/runtime/*
      - /workflow/history/*
      - /workflow/query/*
      - /workflow/form/*
      - /workflow/flowable-rest/*
      - /flowable-rest/*
    priority: 20
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: '{"loi":"API quản trị workflow không mở qua gateway"}'
    upstream_id: app-backend

  # Workflow cho Tầng 2: bắt buộc access token, chuyển tới backend của ứng dụng (bỏ tiền tố).
  # Backend kiểm lại token, tự kiểm quyền rồi gọi Flowable bằng tài khoản kỹ thuật
  # (người dùng không cầm mật khẩu Flowable). Endpoint: apps/<DXOS_APP>/README.md.
  - id: workflow-jwt
    uri: /workflow/*
    priority: 0
    plugin_config_id: jwt-dxos
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        regex_uri: ["^/workflow/(.*)", "/$1"]
    upstream_id: app-backend

  # Dữ liệu phi cấu trúc – link tải đã ký sẵn (presigned GET, SigV4) do backend của ứng dụng
  # cấp sau khi kiểm quyền: không cần JWT, Garage tự kiểm chữ ký và hạn của link (hết hạn
  # hoặc sửa URL → 403). Chỉ GET/HEAD; bỏ header Authorization/Cookie để chỉ link ký sẵn
  # dùng được. Host viết lại thành garage:3900 vì chữ ký được tính với host đó.
  - id: files-s3-ky-san
    uri: /files/s3/*
    methods: [GET, HEAD]
    priority: 10
    plugins:
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        regex_uri: ["^/files/s3/(.*)", "/$1"]
        host: "garage:3900"
        headers:
          remove: [Authorization, Cookie]
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: nosniff
            Cache-Control: "private, no-store"
    upstream_id: garage-s3

  # Dữ liệu phi cấu trúc – API tệp của ứng dụng (tải lên, danh sách, cấp link): bắt buộc
  # access token, body tối đa 10 MiB (413 ngay ở gateway; khớp DXOS_FILE_MAX_BYTES mặc định
  # của backend). Giữ nguyên đường dẫn /files/… khi chuyển tới app-backend.
  - id: files-jwt
    uri: /files/*
    priority: 0
    plugin_config_id: jwt-dxos
    plugins:
      client-control:
        max_body_size: 10485760
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
    upstream_id: app-backend
#END
