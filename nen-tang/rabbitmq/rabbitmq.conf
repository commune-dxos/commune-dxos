# Cấu hình RabbitMQ của lõi (#9), mount thành /etc/rabbitmq/rabbitmq.conf (RABBITMQ_CONFIG_FILE).
# Tài khoản quản trị KHÔNG ở đây: agent rabbitmq-secrets render default_user/default_pass từ
# OpenBao (dxos/core/rabbitmq/admin) vào /run/dxos-secrets/conf.d/ (RABBITMQ_CONFIG_FILES),
# RabbitMQ nạp cả hai. Vhost, user và topology của Tầng 2 do rabbitmq-init tạo.
#
# Cổng (chỉ trong mạng nội bộ Docker, không mở ra host, không có route APISIX):
#   61613 STOMP  – Tầng 2 phát/nhận sự kiện (plugin rabbitmq_stomp)
#   5672  AMQP   – để ngỏ cho Tầng 2 dùng thư viện AMQP; mot-cua không dùng
#   15672 HTTP API quản trị (plugin rabbitmq_management) – chỉ tài khoản có tag administrator
#         đăng nhập được; user Tầng 2 không có tag nào nên bị từ chối (401)

log.console = true
log.console.level = info

# Không user nào chỉ được đăng nhập từ localhost: không có user guest (default_user đã đặt).
loopback_users = none

listeners.tcp.default = 5672
stomp.listeners.tcp.1 = 61613
management.tcp.port = 15672

# Máy dev 16 GB: chặn publisher khi RabbitMQ dùng quá 40% RAM container / còn dưới 1 GB đĩa.
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 1GB

# Thống kê chi tiết của management không cần cho máy dev (giảm RAM, CPU).
management_agent.disable_metrics_collector = true
