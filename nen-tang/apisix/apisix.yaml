# Route của API Gateway (standalone). APISIX nạp lại tệp này khi thay đổi.
# Tầng 2 chỉ gọi lõi qua đây; PostgREST, Flowable và backend Tầng 2 không mở cổng ra
# ngoài (Flowable chỉ có cổng debug trên 127.0.0.1).
# Route của lõi không nêu tên bảng hay tài nguyên nghiệp vụ nào: tài nguyên nào công
# khai, ai được đọc/ghi gì do quyền và RLS trong migration của Tầng 2 quyết định;
# endpoint quy trình do backend Tầng 2 (dịch vụ mot-cua-api) quyết định.
#
# | Route         | Xác thực        | Đích                         | Giới hạn            |
# |---------------|-----------------|------------------------------|---------------------|
# | /public/*     | không (anon)    | PostgREST, chỉ GET/HEAD      | 60 req/phút/IP      |
# | /api/*        | JWT Keycloak    | PostgREST (RLS theo role)    | 600 req/phút/IP     |
# | /workflow/*   | JWT Keycloak    | mot-cua-api → Flowable REST  | 300 req/phút/IP     |
# | /files/*      | JWT Keycloak    | mot-cua-api (API tệp, #7)    | 120 req/phút/IP,    |
# |               |                 |                              | body ≤ 10 MiB       |
# | /files/s3/*   | chữ ký trong URL| Garage S3, chỉ GET/HEAD      | 120 req/phút/IP     |
# | /tro-ly/hoi   | không (công dân)| tro-ly (trợ lý thủ tục, #91),| 10 req/phút/IP,     |
# |               |                 | chỉ POST, chờ tối đa 180 giây| body ≤ 4 KiB        |
# | /tro-ly/*     | không           | tro-ly, chỉ GET/HEAD         | 60 req/phút/IP      |
# | /can-bo,      | không (trang)   | mot-cua-web (cổng cán bộ),   | 300 req/phút/IP     |
# | /can-bo/*     |                 | chỉ GET/HEAD, noindex, #55   |                     |
# | /* (còn lại)  | không           | mot-cua-web (cổng công dân), | 600 req/phút/IP     |
# |               |                 | chỉ GET/HEAD, #57            |                     |
# Đường dẫn API quản trị Flowable (repository, management, identity…) bị chặn 403 ở
# gateway, kể cả khi sau này Tầng 2 chọn chuyển tiếp thẳng tới Flowable.

upstreams:
  - id: postgrest
    type: roundrobin
    nodes:
      "postgrest:3000": 1
    # Kiểm chủ động admin server của PostgREST (cổng 3001, /ready = đã nối CSDL và nạp schema).
    checks:
      active:
        type: http
        http_path: /ready
        port: 3001
        healthy:
          interval: 5
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 2

  # Backend riêng của Tầng 2 DXOS_TANG2 (tên dịch vụ chung, không gắn tên nghiệp vụ).
  - id: mot-cua-api
    type: roundrobin
    nodes:
      "mot-cua-api:8000": 1

  # Web Tầng 2: bản build tĩnh của cổng công dân (nginx, #57).
  - id: mot-cua-web
    type: roundrobin
    nodes:
      "mot-cua-web:8080": 1

  # Trợ lý thủ tục của Tầng 2 (#91): tìm kiếm + RAG, không cần token. Mô hình chạy CPU có thể mất cả phút.
  - id: tro-ly
    type: roundrobin
    timeout:
      connect: 5
      send: 30
      read: 180
    nodes:
      "tro-ly:8000": 1

  # Superset (profile bi, #82): dashboard báo cáo, tự xử lý đăng nhập (SSO Keycloak).
  - id: superset
    type: roundrobin
    nodes:
      "superset:8088": 1

  # API S3 của Garage (object storage của lõi). Chỉ dùng cho link GET đã ký sẵn.
  - id: garage-s3
    type: roundrobin
    nodes:
      "garage:3900": 1

# Kiểm access token Keycloak (realm dxos), dùng chung cho mọi route cần đăng nhập.
# APISIX kiểm chữ ký bằng JWKS, hạn, issuer; phía sau (PostgREST, mot-cua-api) kiểm lại.
plugin_configs:
  - id: jwt-dxos
    plugins:
      openid-connect:
        client_id: dxos_api
        # Schema plugin bắt buộc trường này, nhưng với bearer_only + use_jwks
        # APISIX không gọi introspection nên giá trị không được dùng. Không phải bí mật.
        client_secret: khong-dung-o-che-do-bearer-only
        discovery: http://keycloak:8080/realms/dxos/.well-known/openid-configuration
        realm: dxos
        bearer_only: true
        use_jwks: true

# CORS cho web Tầng 2 (trình duyệt). Origin lấy từ biến môi trường DXOS_CORS_ORIGINS
# (docker-compose.yml, .env), cách nhau bởi dấu phẩy. Origin lạ không nhận header CORS.
global_rules:
  - id: cors
    plugins:
      cors:
        allow_origins: "${{DXOS_CORS_ORIGINS}}"
        allow_methods: "GET,HEAD,POST,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Prefer,Range,Accept,Accept-Profile,Content-Profile"
        expose_headers: "Content-Range,Content-Location,Location,X-RateLimit-Limit,X-RateLimit-Remaining"
        max_age: 600

routes:
  # Đọc công khai, không cần token: luôn chạy với role PostgreSQL `anon` (header
  # Authorization bị bỏ), chỉ GET/HEAD, giới hạn tần suất chặt cho cổng công dân.
  # Ví dụ: /public/thu_tuc → bảng mà Tầng 2 đã GRANT SELECT cho anon.
  - id: public-anon
    uri: /public/*
    methods: [GET, HEAD, OPTIONS]
    priority: 10
    plugins:
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: '{"loi":"Vượt giới hạn 60 request/phút, thử lại sau"}'
        policy: local
      proxy-rewrite:
        regex_uri: ["^/public/(.*)", "/$1"]
        headers:
          remove: [Authorization]
    upstream_id: postgrest

  # Dữ liệu có cấu trúc của Tầng 2: bắt buộc access token. PostgREST kiểm lại token
  # rồi SET ROLE theo claim resource_access.dxos_api.roles[0] để RLS áp dụng.
  - id: api-jwt
    uri: /api/*
    priority: 0
    plugin_config_id: jwt-dxos
    plugins:
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        regex_uri: ["^/api/(.*)", "/$1"]
    upstream_id: postgrest

  # Chặn API quản trị của Flowable REST từ ngoài (triển khai quy trình, quản trị engine,
  # người dùng/nhóm, truy vấn tùy ý), không cần biết backend phía sau là gì.
  - id: workflow-chan-quan-tri
    uris:
      - /workflow/repository/*
      - /workflow/management/*
      - /workflow/identity/*
      - /workflow/runtime/*
      - /workflow/history/*
      - /workflow/query/*
      - /workflow/form/*
      - /workflow/flowable-rest/*
      - /flowable-rest/*
    priority: 20
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: '{"loi":"API quản trị workflow không mở qua gateway"}'
    upstream_id: mot-cua-api

  # Workflow cho Tầng 2: bắt buộc access token, chuyển tới backend Tầng 2 (bỏ tiền tố).
  # Backend kiểm lại token, tự kiểm quyền rồi gọi Flowable bằng tài khoản kỹ thuật
  # (người dùng không cầm mật khẩu Flowable). Endpoint: mot-cua/README.md.
  - id: workflow-jwt
    uri: /workflow/*
    priority: 0
    plugin_config_id: jwt-dxos
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        regex_uri: ["^/workflow/(.*)", "/$1"]
    upstream_id: mot-cua-api

  # Dữ liệu phi cấu trúc – link tải đã ký sẵn (presigned GET, SigV4) do backend Tầng 2
  # cấp sau khi kiểm quyền: không cần JWT, Garage tự kiểm chữ ký và hạn của link (hết hạn
  # hoặc sửa URL → 403). Chỉ GET/HEAD; bỏ header Authorization/Cookie để chỉ link ký sẵn
  # dùng được. Host viết lại thành garage:3900 vì chữ ký được tính với host đó.
  - id: files-s3-ky-san
    uri: /files/s3/*
    methods: [GET, HEAD]
    priority: 10
    plugins:
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        regex_uri: ["^/files/s3/(.*)", "/$1"]
        host: "garage:3900"
        headers:
          remove: [Authorization, Cookie]
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: nosniff
            Cache-Control: "private, no-store"
    upstream_id: garage-s3

  # Dữ liệu phi cấu trúc – API tệp của Tầng 2 (tải lên, danh sách, cấp link): bắt buộc
  # access token, body tối đa 10 MiB (413 ngay ở gateway; khớp DXOS_FILE_MAX_BYTES mặc định
  # của backend). Giữ nguyên đường dẫn /files/… khi chuyển tới mot-cua-api.
  - id: files-jwt
    uri: /files/*
    priority: 0
    plugin_config_id: jwt-dxos
    plugins:
      client-control:
        max_body_size: 10485760
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
    upstream_id: mot-cua-api

  # Trợ lý thủ tục (#91): người dân hỏi trên cổng công dân không cần đăng nhập. Câu hỏi tốn tài nguyên (mô hình
  # ngôn ngữ) nên giới hạn chặt theo IP và kích thước body; bỏ Authorization/Cookie (dịch vụ không cần danh tính,
  # không lưu câu hỏi). Phần GET (thông tin chế độ, chỉ tìm từ khóa) giới hạn như /public.
  - id: tro-ly-hoi
    uri: /tro-ly/hoi
    methods: [POST, OPTIONS]
    priority: 10
    plugins:
      client-control:
        max_body_size: 4096
      limit-count:
        count: 10
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: '{"loi":"Bạn hỏi quá nhanh (tối đa 10 câu/phút), vui lòng thử lại sau ít phút"}'
        policy: local
      proxy-rewrite:
        headers:
          remove: [Authorization, Cookie]
    upstream_id: tro-ly

  - id: tro-ly
    uri: /tro-ly/*
    methods: [GET, HEAD, OPTIONS]
    priority: 0
    plugins:
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: '{"loi":"Vượt giới hạn 60 request/phút, thử lại sau"}'
        policy: local
      proxy-rewrite:
        headers:
          remove: [Authorization, Cookie]
    upstream_id: tro-ly

  # Cổng cán bộ (web Tầng 2, #55): cùng dịch vụ mot-cua-web với cổng công dân (SPA fallback, CSP và
  # header bảo mật do nginx đặt), route riêng để giới hạn chặt hơn và báo máy tìm kiếm không lập chỉ
  # mục. Trang tĩnh không cần token: dữ liệu đi qua /api, /workflow, /files bằng token của cán bộ
  # (client mot_cua_can_bo, mật khẩu + OTP).
  - id: mot-cua-web-can-bo
    uris: [/can-bo, /can-bo/*]
    methods: [GET, HEAD]
    priority: -5
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        headers:
          remove: [Authorization, Cookie]
      response-rewrite:
        headers:
          set:
            X-Robots-Tag: "noindex, nofollow"
    upstream_id: mot-cua-web

  # Dashboard Superset (#82, profile bi): Superset chạy dưới tiền tố /bao-cao (SUPERSET_APP_ROOT) nên
  # không cắt tiền tố. Không kiểm JWT ở gateway: Superset tự đăng nhập bằng SSO Keycloak (phiên cookie)
  # và chỉ vai được ánh xạ mới xem được dashboard. Chưa chạy make up-bi → 502/503.
  - id: superset
    uris: [/bao-cao, /bao-cao/*]
    priority: -4
    plugins:
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      response-rewrite:
        headers:
          set:
            X-Robots-Tag: "noindex, nofollow"
    upstream_id: superset

  # Nút "Sign in with Keycloak" của trang đăng nhập Superset 6.1 dựng link cứng `/login/<provider>`, bỏ qua
  # SUPERSET_APP_ROOT (#110), nên trỏ ra ngoài /bao-cao và rơi vào cổng công dân (404). Chuyển đúng đường dẫn
  # đó về /bao-cao/login/keycloak, giữ ?next=…; không sửa mã Superset. Chỉ một đường dẫn, không che route nào của web.
  - id: superset-dang-nhap
    uri: /login/keycloak
    methods: [GET, HEAD]
    priority: -4
    plugins:
      redirect:
        uri: /bao-cao/login/keycloak
        append_query_string: true
        ret_code: 302

  # Cổng công dân (web Tầng 2, #57): mọi đường dẫn không thuộc route nào ở trên, ưu tiên thấp nhất
  # nên không che /public, /api, /workflow, /files. Không cần token (trang tĩnh; dữ liệu vẫn đi qua
  # các route trên). Chỉ GET/HEAD. nginx của mot-cua-web trả index.html cho route SPA (200) và
  # đường dẫn lạ (404), đặt CSP và header bảo mật; header Authorization/Cookie không chuyển tiếp.
  - id: mot-cua-web
    uri: /*
    methods: [GET, HEAD]
    priority: -10
    plugins:
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      proxy-rewrite:
        headers:
          remove: [Authorization, Cookie]
    upstream_id: mot-cua-web
#END
