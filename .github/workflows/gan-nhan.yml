# SPDX-License-Identifier: Apache-2.0
# Tự gắn nhãn thành phần cho PR theo .github/labeler.yml (D-009 hướng 3, #34).
# pull_request_target để gắn được nhãn cả cho PR từ fork; job KHÔNG checkout mã của PR,
# labeler chỉ đọc danh sách tệp qua API và đọc labeler.yml từ nhánh đích.
# Không đặt làm check bắt buộc của bảo vệ nhánh. Action ghim phiên bản.
name: gan-nhan
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gan-nhan:
    name: gan-nhan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
