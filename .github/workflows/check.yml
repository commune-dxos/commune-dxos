# CI trên mỗi push vào main/develop và mỗi PR. Mỗi job là một check riêng, tên ngắn và ổn định
# để đặt làm check bắt buộc trong bảo vệ nhánh; không job nào lọc theo đường dẫn (check bắt
# buộc bị bỏ qua sẽ chặn PR). Mỗi job gọi đúng lệnh `make` chạy được trên máy (#11):
#   make-check    SPDX GPL-3.0-or-later trong từng tệp (PoF tiêu chí 2, D-010), gói thu-tuc/* hợp lệ + compose hợp lệ mọi profile (tiêu chí 4)
#   shellcheck    make lint → scripts/lint.sh shellcheck
#   yamllint      make lint → scripts/lint.sh yamllint (.yamllint.yml)
#   bpmn          make lint → scripts/lint.sh bpmn (cấu trúc BPMN thu-tuc/*/quy-trinh.bpmn20.xml + test bộ kiểm)
#   test-backend  make test-backend (unittest của mot-cua/backend, kể cả bộ nạp gói thủ tục và Poka-yoke)
#   test-sql      make test-sql: PostgreSQL trống → migration nền tảng + mot-cua → mot-cua/db/tests/*.sql
#   kho-du-lieu   make test-kho: dữ liệu mẫu giả → Parquet → dbt build + docs generate (#80; không bắt buộc)
# Action và công cụ ghim phiên bản; công cụ lint ghim trong scripts/requirements-lint.txt.
name: check
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  make-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      # make check chạy cả test-backend: cần jsonschema như image mot-cua-api (#59).
      - name: Cài thư viện của mot-cua-api (phiên bản ghim)
        run: pip install -r mot-cua/backend/requirements.txt
      - name: Kiểm tra giấy phép, gói thủ tục và compose
        run: make check

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Cài công cụ lint (phiên bản ghim)
        run: pip install -r scripts/requirements-lint.txt
      - name: shellcheck mọi *.sh
        run: bash scripts/lint.sh shellcheck

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Cài công cụ lint (phiên bản ghim)
        run: pip install -r scripts/requirements-lint.txt
      - name: yamllint compose, APISIX, workflow
        run: bash scripts/lint.sh yamllint

  # REUSE 3.3 (#104): mọi tệp có bản quyền + giấy phép (header SPDX hoặc REUSE.toml), giấy phép có toàn văn ở LICENSES/.
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Cài công cụ lint (phiên bản ghim)
        run: pip install -r scripts/requirements-lint.txt
      - name: reuse lint
        run: bash scripts/lint.sh reuse

  bpmn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Kiểm cấu trúc BPMN thu-tuc/*/quy-trinh.bpmn20.xml
        run: bash scripts/lint.sh bpmn

  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      # Cùng nhánh Python với image mot-cua-api (python:3.13.16-alpine3.24).
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Cài thư viện của mot-cua-api (phiên bản ghim)
        run: pip install -r mot-cua/backend/requirements.txt
      - name: Test đơn vị bộ máy một cửa và bộ nạp gói
        run: make test-backend

  kho-du-lieu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      # Cùng nhánh Python với image kho-du-lieu (python:3.13.16-slim-bookworm).
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Cài duckdb, dbt-core, dbt-duckdb (phiên bản ghim)
        run: "pip install --only-binary=:all: -r mot-cua/kho-du-lieu/requirements.txt"
      - name: Xuất Parquet, dbt build + test + docs generate, kiểm số liệu mart trên dữ liệu mẫu
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: make test-kho

  test-sql:
    runs-on: ubuntu-24.04
    # Không dùng service container: migration của mot-cua cần pgvector (#91), image postgres gốc không có.
    # make test-sql tự build image PostgreSQL của nền tảng (nen-tang/postgres/Dockerfile: pgAudit + pgvector,
    # đúng tag trong docker-compose.yml) rồi chạy migration + test trong container tạm.
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Image PostgreSQL khớp docker-compose.yml
        run: |
          grep -Eq '^ +image: postgres:17\.6-alpine$' docker-compose.yml
          grep -Eq '^ARG POSTGRES_IMAGE=postgres:17\.6-alpine$' nen-tang/postgres/Dockerfile
      - name: Migration + test SQL/RLS
        run: make test-sql
